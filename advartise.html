<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advertise With Us - RX PLAYER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --primary-red: #E50914;
            --bg-primary: #0A0A0F;
            --bg-card: #1A1A24;
            --bg-secondary: #14141C;
            --text-white: #FFFFFF;
            --text-muted: #A0A0AA;
            --telegram-blue: #0088cc;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-white);
            margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 550px; padding: 30px 20px;
        }
        .card {
            background: var(--bg-card); border-radius: 16px;
            padding: 40px 30px; border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
        }
        .icon-box {
            width: 80px; height: 80px; background: rgba(229, 9, 20, 0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; border: 2px solid rgba(229, 9, 20, 0.3);
        }
        .icon-box i {
            font-size: 36px; color: var(--primary-red);
        }
        .header h1 { font-size: 26px; font-weight: 800; margin: 0 0 12px; letter-spacing: -0.5px; }
        .header p { color: var(--text-muted); font-size: 15px; margin: 0 0 25px; line-height: 1.5; }
        
        .benefits {
            background: var(--bg-secondary); border-radius: 12px;
            padding: 20px; text-align: left; margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .benefits p {
            margin: 0 0 12px; font-size: 14px; color: #fff; display: flex; align-items: center; gap: 10px;
        }
        .benefits p:last-child { margin-bottom: 0; }
        .benefits i { color: #22c55e; font-size: 16px; }

        .telegram-btn {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 16px; background: linear-gradient(135deg, #0088cc, #0077b5);
            color: #fff; border: none; border-radius: 10px; font-size: 16px;
            font-weight: 700; text-decoration: none; transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 136, 204, 0.3);
        }
        .telegram-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 136, 204, 0.5);
        }
        .telegram-btn i { font-size: 22px; }

        .back-link {
            display: inline-block; margin-top: 25px; color: var(--text-muted);
            text-decoration: none; font-size: 14px; transition: 0.2s;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="icon-box">
                <i class="fas fa-bullhorn"></i>
            </div>
            
            <div class="header">
                <h1>Advertise With Us</h1>
                <p>Promote your business, product, or service to thousands of daily active users on RX PLAYER.</p>
            </div>

            <div class="benefits">
                <p><i class="fas fa-check-circle"></i> High Daily Traffic</p>
                <p><i class="fas fa-check-circle"></i> Targeted Movie & TV Audience</p>
                <p><i class="fas fa-check-circle"></i> Affordable Pricing Plans</p>
            </div>

            <a href="https://t.me/heyyyyuuuu" target="_blank" class="telegram-btn">
                <i class="fab fa-telegram-plane"></i> Contact on Telegram
            </a>
            
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

</body>
</html>
