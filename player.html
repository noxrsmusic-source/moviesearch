<script>
(function () {
    var BASE = 'https://rxplayer-indol.vercel.app';

    // Sab kuch DOM se rebuild karo — junk source ko touch hi nahi karta
    function buildShareText() {
        var $ = function (id) { return document.getElementById(id); };
        var title  = ($('movieTitle')  && $('movieTitle').textContent  || '').trim();
        var year   = ($('movieYear')   && $('movieYear').textContent   || '').trim();
        var rating = ($('movieRating') && $('movieRating').textContent || '').replace(/[^\d.]/g, '').trim();
        var plot   = ($('moviePlot')   && $('moviePlot').textContent   || '').trim();

        var p = new URLSearchParams(window.location.search);
        var id = p.get('id') || '';
        var type = p.get('type') || 'movie';
        var url = BASE + '/landing.html?id=' + id + '&type=' + type;

        if (!title) return null;

        return '🎬 ' + title + (year ? ' (' + year + ')' : '') + '\n'
             + (rating ? '⭐ Rating: ' + rating + '\n' : '') + '\n'
             + '📝 ' + plot + '\n\n'
             + '📺 Watch or Download here:\n' + url;
    }

    // Fallback: agar DOM se na mile to string se hi junk hata do
    function sanitize(t) {
        if (typeof t !== 'string') return t;
        return t
            .replace(/%[0-9A-F](?![0-9A-F])/gi, '')   // %C, %D, %0 sab udao
            .replace(/file:\/{1,3}/g, BASE + '/')
            .replace(/[ \t]+\n/g, '\n')
            .replace(/\n{3,}/g, '\n\n')
            .replace(/^\s+|\s+$/g, '');
    }

    // 1) Mobile share sheet
    if (navigator.share) {
        var _share = navigator.share.bind(navigator);
        navigator.share = function (data) {
            if (data) {
                var clean = buildShareText();
                if (clean) data.text = clean;
                else if (data.text) data.text = sanitize(data.text);
                if (data.url) data.url = BASE + '/landing.html?id=' +
                    new URLSearchParams(location.search).get('id') +
                    '&type=' + (new URLSearchParams(location.search).get('type') || 'movie');
            }
            return _share(data);
        };
    }

    // 2) Clipboard (Direct Share / Copy)
    if (navigator.clipboard && navigator.clipboard.writeText) {
        var _write = navigator.clipboard.writeText.bind(navigator.clipboard);
        navigator.clipboard.writeText = function (txt) {
            return _write(buildShareText() || sanitize(txt));
        };
    }

    // 3) Purana execCommand('copy') fallback
    var _exec = document.execCommand.bind(document);
    document.execCommand = function (cmd) {
        if (String(cmd).toLowerCase() === 'copy') {
            var el = document.activeElement;
            if (el && typeof el.value === 'string') {
                el.value = buildShareText() || sanitize(el.value);
            }
        }
        return _exec.apply(document, arguments);
    };
})();
</script>
