<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RX PLAYER — Watch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-red: #E50914;
            --bg-primary: #0A0A0F;
            --bg-card: #1A1A24;
            --bg-secondary: #14141C;
            --text-white: #FFFFFF;
            --text-muted: #A0A0AA;
            --shadow: 0 12px 48px rgba(0, 0, 0, 0.7);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --header-height: 62px;
            --sticky-banner-height: 70px;
            --server-green: #22C55E;
            --server-red: #EF4444;
            --server-red-plus: #FF1E38;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-white);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding-top: var(--header-height);
            padding-bottom: var(--sticky-banner-height);
        }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: var(--font); border: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--bg-secondary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-red); }
        .container { max-width: 1440px; margin: 0 auto; padding: 0 24px; }

        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: var(--bg-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 10px 0; height: var(--header-height);
            display: flex; align-items: center; transition: var(--transition);
        }
        .header.scrolled { background: var(--bg-primary); box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6); }
        .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .logo span { color: var(--primary-red); }
        .logo i { color: var(--primary-red); font-size: 18px; }
        .header-actions { display: flex; align-items: center; gap: 14px; }
        .header-actions .back-btn {
            padding: 6px 16px; border-radius: 30px; background: rgba(255, 255, 255, 0.06);
            font-size: 13px; font-weight: 600; transition: var(--transition);
            display: flex; align-items: center; gap: 6px;
        }
        .header-actions .back-btn:hover { background: rgba(255, 255, 255, 0.12); }
        .header-actions .profile-btn {
            width: 34px; height: 34px; border-radius: 50%; background: var(--bg-secondary);
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            transition: var(--transition); border: 2px solid transparent;
        }
        .header-actions .profile-btn:hover { border-color: var(--primary-red); }

        .player-row { display: flex; gap: 20px; align-items: flex-start; }
        .player-wrapper {
            flex: 1; background: #000; border-radius: var(--radius); overflow: hidden;
            position: relative; aspect-ratio: 16 / 9; width: 100%; max-height: 75vh;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .player-wrapper:fullscreen, .player-wrapper:-webkit-full-screen {
            max-height: 100vh; width: 100vw; border-radius: 0; border: none; aspect-ratio: auto;
        }
        .player-wrapper iframe { width: 100%; height: 100%; border: none; display: block; position: relative; z-index: 1; }

        .pause-ad-overlay {
            position: absolute; left: 0; right: 0; z-index: 10; display: none;
            align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px); padding: 8px 12px; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .pause-ad-overlay.visible { display: flex; pointer-events: auto; }
        .pause-ad-overlay.top { top: 0; min-height: 100px; border-bottom: 2px solid rgba(229, 9, 20, 0.3); }
        .pause-ad-overlay.bottom { bottom: 0; min-height: 100px; border-top: 2px solid rgba(229, 9, 20, 0.3); }
        .pause-ad-overlay .ad-inner {
            width: 100%; max-width: 728px; margin: 0 auto; display: flex;
            align-items: center; justify-content: center; min-height: 90px;
        }
        .pause-ad-overlay .ad-inner iframe { max-width: 100%; border: none; border-radius: 4px; }
        .pause-ad-overlay .ad-label {
            position: absolute; top: 2px; right: 8px; font-size: 9px;
            text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5); padding: 2px 8px; border-radius: 10px; pointer-events: none;
        }
        .pause-ad-overlay .ad-label i { margin-right: 4px; font-size: 8px; }

        .pause-badge {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9;
            display: none; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px); border-radius: 50%;
            width: 72px; height: 72px; border: 2px solid rgba(255, 255, 255, 0.15);
            pointer-events: none; transition: opacity 0.3s ease;
        }
        .pause-badge.visible { display: flex; }
        .pause-badge i { font-size: 32px; color: #fff; opacity: 0.8; }

        .player-branding {
            position: absolute; top: 14px; right: 14px; z-index: 2147483647;
            display: flex; align-items: center; gap: 6px; padding: 6px 14px;
            background: rgba(10, 10, 15, 0.88); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 30px;
            font-size: 12px; font-weight: 800; letter-spacing: 0.5px; color: #fff;
            pointer-events: none; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            user-select: none; min-width: 110px; justify-content: center;
            opacity: 1 !important; visibility: visible !important;
        }
        .player-branding i { color: var(--primary-red); margin-right: 4px; }
        .player-branding span { color: var(--primary-red); }

        .custom-fs-btn {
            position: absolute; bottom: 20px; right: 12px; z-index: 2147483647;
            background: #0B0B12; border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; width: 46px; height: 46px;
            display: flex; align-items: center; justify-content: center;
            color: #ffffff; font-size: 16px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.9);
            opacity: 1 !important; visibility: visible !important; pointer-events: auto !important;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .custom-fs-btn:hover { background: var(--primary-red); border-color: var(--primary-red); transform: scale(1.05); }

        .server-issue-overlay {
            position: absolute; inset: 0; z-index: 6; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px); display: none; flex-direction: column;
            align-items: center; justify-content: center; padding: 30px; text-align: center; gap: 16px;
        }
        .server-issue-overlay.visible { display: flex; }
        .server-issue-overlay .icon { font-size: 48px; color: var(--server-red); opacity: 0.8; }
        .server-issue-overlay h3 { font-size: 22px; font-weight: 700; }
        .server-issue-overlay p { color: var(--text-muted); max-width: 440px; font-size: 15px; }
        .server-issue-overlay .switch-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
        .server-issue-overlay .switch-btn {
            padding: 10px 24px; border-radius: 50px; font-weight: 700; font-size: 14px;
            transition: var(--transition); border: 2px solid transparent;
            display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.04);
        }
        .server-issue-overlay .switch-btn:hover { transform: scale(1.05); }
        .server-issue-overlay .switch-btn.main { color: var(--server-red-plus); border-color: var(--server-red-plus); }
        .server-issue-overlay .switch-btn.main:hover { background: rgba(255, 30, 56, 0.15); }
        .server-issue-overlay .switch-btn.red { color: var(--server-red); border-color: var(--server-red); }
        .server-issue-overlay .switch-btn.red:hover { background: rgba(239, 68, 68, 0.15); }
        .server-issue-overlay .switch-btn.green { color: var(--server-green); border-color: var(--server-green); }
        .server-issue-overlay .switch-btn.green:hover { background: rgba(34, 197, 94, 0.15); }

        .ad-banner-container {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: var(--radius); padding: 12px 10px; width: 100%;
        }
        .ad-banner-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--text-muted); margin-bottom: 8px; width: 100%; text-align: left;
        }
        .ad-iframe-frame {
            width: 100%; height: 250px; border: none; border-radius: var(--radius-sm);
            background: transparent; display: block;
        }
        .ad-desktop { flex: 0 0 340px; max-width: 340px; }

        .ad-mobile-stack {
            display: none; flex-direction: column; align-items: center; gap: 8px;
            margin-top: 20px; width: 100%; max-width: 100%; padding: 10px;
            background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
        }
        .ad-mobile-stack .ad-iframe-frame { height: 140px; }

        .player-info {
            margin-top: 16px; display: flex; flex-wrap: wrap; gap: 12px 20px;
            align-items: flex-start; justify-content: space-between;
        }
        .player-info .title-section h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
        .player-info .title-section .meta {
            display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px;
            color: var(--text-muted); margin-top: 4px;
        }
        .player-info .title-section .meta .type-badge {
            text-transform: capitalize; padding: 2px 12px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.06); font-size: 12px; font-weight: 600;
        }
        .player-info .title-section .meta .rating { color: #F5C518; font-weight: 600; }
        .player-info .title-section .meta .rating i { font-size: 12px; }

        .server-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
        .server-controls .server-group {
            display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.03);
            padding: 4px 6px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .server-btn {
            padding: 6px 16px; border-radius: 30px; font-size: 12px; font-weight: 700;
            transition: var(--transition); border: 2px solid transparent;
            display: flex; align-items: center; gap: 6px;
        }
        .server-btn .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .server-btn.main { color: var(--server-red-plus); }
        .server-btn.main .dot { background: var(--server-red-plus); }
        .server-btn.main.active { background: rgba(255, 30, 56, 0.15); border-color: var(--server-red-plus); }
        .server-btn.red { color: var(--server-red); }
        .server-btn.red .dot { background: var(--server-red); }
        .server-btn.red.active { background: rgba(239, 68, 68, 0.15); border-color: var(--server-red); }
        .server-btn.green { color: var(--server-green); }
        .server-btn.green .dot { background: var(--server-green); }
        .server-btn.green.active { background: rgba(34, 197, 94, 0.15); border-color: var(--server-green); }
        .server-btn:not(.active) { opacity: 0.5; }
        .server-btn:not(.active):hover { opacity: 0.8; }

        .server-issue-trigger {
            padding: 6px 14px; border-radius: 30px; background: rgba(239, 68, 68, 0.08);
            color: var(--server-red); font-size: 12px; font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.15); transition: var(--transition);
            display: flex; align-items: center; gap: 6px;
        }
        .server-issue-trigger:hover { background: rgba(239, 68, 68, 0.15); }

        .episode-controls {
            display: none; flex-wrap: wrap; gap: 10px; align-items: center;
            margin-top: 8px; padding: 10px 14px; background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm); border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .episode-controls.visible { display: flex; }
        .episode-controls label {
            font-size: 13px; font-weight: 600; color: var(--text-muted);
            display: flex; align-items: center; gap: 6px;
        }
        .episode-controls select {
            padding: 6px 12px; border-radius: 30px; background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08); color: var(--text-white);
            font-size: 13px; font-weight: 500; outline: none; cursor: pointer;
            font-family: var(--font); min-width: 60px; max-width: 260px;
        }
        .episode-controls select:focus { border-color: var(--primary-red); }
        .episode-controls select option { background: var(--bg-secondary); color: var(--text-white); }
        .episode-controls .apply-btn {
            padding: 6px 20px; border-radius: 30px; background: var(--primary-red);
            color: #fff; font-size: 13px; font-weight: 700; transition: var(--transition);
        }
        .episode-controls .apply-btn:hover { background: #b20710; transform: scale(1.04); }

        .plot-section {
            margin-top: 14px; padding: 14px 16px; background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm); border-left: 3px solid var(--primary-red);
        }
        .plot-section p { font-size: 14px; color: rgba(255, 255, 255, 0.7); line-height: 1.7; }
        .plot-section .plot-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 4px;
        }

        .sticky-bottom-banner {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 6px 12px 8px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.7); transition: var(--transition);
        }
        .sticky-banner-header {
            width: 100%; max-width: 320px; display: flex;
            justify-content: center; align-items: center; margin-bottom: 2px;
        }
        .sticky-banner-label {
            font-size: 9px; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--text-muted);
        }
        .sticky-banner-content {
            width: 320px; height: 50px; max-width: 100%;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .toast-container {
            position: fixed; bottom: 80px; right: 24px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px; max-width: 380px; width: 100%;
        }
        .toast {
            padding: 14px 20px; border-radius: var(--radius-sm); background: var(--bg-card);
            border-left: 4px solid var(--primary-red); box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 12px;
            animation: slideUp 0.3s ease; font-size: 14px;
        }
        .toast.success { border-left-color: #22C55E; }
        .toast.error { border-left-color: var(--primary-red); }
        .toast .toast-icon { font-size: 20px; flex-shrink: 0; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            :root { --header-height: 56px; }
            .header { padding: 6px 0; }
            .logo { font-size: 18px; }
            .logo i { font-size: 15px; }
            .header-actions .back-btn { font-size: 12px; padding: 4px 12px; }
            .header-actions .profile-btn { width: 30px; height: 30px; font-size: 12px; }
            .player-section { padding: 10px 0 20px; }
            .player-row { flex-direction: column; align-items: stretch; gap: 16px; }
            .player-wrapper { max-height: 55vh; border-radius: var(--radius-sm); }
            .ad-desktop { display: none; }
            .ad-mobile-stack { display: flex; }
            .player-branding { top: 8px; right: 8px; padding: 4px 10px; font-size: 10px; min-width: 90px; }
            .custom-fs-btn { bottom: 10px; right: 8px; width: 40px; height: 40px; font-size: 14px; }
            .player-info .title-section h1 { font-size: 18px; }
            .player-info .title-section .meta { font-size: 12px; gap: 8px; }
            .server-btn { font-size: 11px; padding: 4px 12px; }
            .server-controls .server-group { padding: 3px 4px; }
            .server-issue-trigger { font-size: 11px; padding: 4px 10px; }
            .episode-controls { padding: 8px 12px; }
            .episode-controls label { font-size: 12px; }
            .episode-controls select { font-size: 12px; padding: 4px 10px; min-width: 50px; max-width: 170px; }
            .episode-controls .apply-btn { font-size: 12px; padding: 4px 14px; }
            .plot-section p { font-size: 13px; }
            .container { padding: 0 12px; }
            .toast-container { right: 12px; bottom: 74px; }
            .server-issue-overlay { padding: 20px 16px; gap: 12px; }
            .server-issue-overlay .icon { font-size: 36px; }
            .server-issue-overlay h3 { font-size: 18px; word-break: break-word; }
            .server-issue-overlay p { font-size: 13px; max-width: 100%; word-break: break-word; }
            .server-issue-overlay .switch-btn { padding: 8px 16px; font-size: 12px; white-space: nowrap; justify-content: center; }
            .server-issue-overlay .switch-actions { gap: 8px; flex-direction: column; align-items: stretch; }
            .pause-ad-overlay { padding: 4px 8px; min-height: 70px; }
            .pause-ad-overlay .ad-inner { min-height: 60px; }
            .pause-ad-overlay .ad-inner iframe { max-height: 70px; }
            .pause-ad-overlay.top, .pause-ad-overlay.bottom { min-height: 70px; }
            .pause-badge { width: 56px; height: 56px; }
            .pause-badge i { font-size: 24px; }
        }
        @media (max-width: 480px) {
            .player-wrapper { max-height: 45vh; }
            .player-info .title-section h1 { font-size: 16px; }
            .server-controls { gap: 6px; }
            .server-btn { font-size: 10px; padding: 3px 10px; }
            .episode-controls { gap: 6px; }
            .episode-controls select { font-size: 11px; padding: 3px 8px; min-width: 44px; max-width: 140px; }
            .custom-fs-btn { bottom: 8px; right: 6px; width: 36px; height: 36px; font-size: 13px; }
            .server-issue-overlay { padding: 16px 12px; gap: 10px; }
            .server-issue-overlay .icon { font-size: 28px; }
            .server-issue-overlay h3 { font-size: 16px; }
            .server-issue-overlay p { font-size: 12px; }
            .server-issue-overlay .switch-btn { padding: 6px 12px; font-size: 11px; }
            .pause-ad-overlay { padding: 3px 6px; min-height: 56px; }
            .pause-ad-overlay .ad-inner { min-height: 50px; }
            .pause-ad-overlay .ad-inner iframe { max-height: 56px; }
            .pause-ad-overlay.top, .pause-ad-overlay.bottom { min-height: 56px; }
            .pause-badge { width: 44px; height: 44px; }
            .pause-badge i { font-size: 18px; }
        }
        @media (min-width: 769px) {
            .ad-desktop { display: flex; }
            .ad-mobile-stack { display: none; }
        }

        .player-wrapper:fullscreen .pause-ad-overlay,
        .player-wrapper:-webkit-full-screen .pause-ad-overlay { z-index: 2147483646; }
        .player-wrapper:fullscreen .pause-badge,
        .player-wrapper:-webkit-full-screen .pause-badge { z-index: 2147483645; }
        .player-wrapper:fullscreen .player-branding,
        .player-wrapper:-webkit-full-screen .player-branding { z-index: 2147483647; }
        .player-wrapper:fullscreen .custom-fs-btn,
        .player-wrapper:-webkit-full-screen .custom-fs-btn { z-index: 2147483647; }
        .player-wrapper:fullscreen .server-issue-overlay,
        .player-wrapper:-webkit-full-screen .server-issue-overlay { z-index: 2147483646; }
    </style>
</head>
<body>

    <header class="header" id="mainHeader">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <i class="fas fa-play-circle"></i> RX<span>PLAYER</span>
            </a>
            <div class="header-actions">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
                <button class="profile-btn" id="profileBtn"><i class="fas fa-user"></i></button>
            </div>
        </div>
    </header>

    <section class="player-section container">
        <div class="player-row">
            <div class="player-wrapper" id="playerWrapper">
                <div class="player-branding" id="playerBranding">
                    <i class="fas fa-play-circle"></i> RX<span>PLAYER</span>
                </div>

                <button class="custom-fs-btn" id="customFsBtn" title="Full Screen">
                    <i class="fas fa-expand" id="fsIcon"></i>
                </button>

                <iframe id="playerIframe" allow="fullscreen" allowfullscreen></iframe>

                <div class="pause-ad-overlay top" id="pauseAdTop">
                    <span class="ad-label"><i class="fas fa-pause"></i> Paused</span>
                    <div class="ad-inner" id="pauseAdTopInner"></div>
                </div>
                <div class="pause-ad-overlay bottom" id="pauseAdBottom">
                    <span class="ad-label"><i class="fas fa-pause"></i> Paused</span>
                    <div class="ad-inner" id="pauseAdBottomInner"></div>
                </div>

                <div class="pause-badge" id="pauseBadge">
                    <i class="fas fa-pause-circle"></i>
                </div>

                <div class="server-issue-overlay" id="serverIssueOverlay">
                    <div class="icon"><i class="fas fa-exclamation-triangle"></i></div>
                    <h3>Loading is taking a while</h3>
                    <p>This may be due to a slow network connection or temporary server slowness. You can wait, retry, or switch to another server below.</p>
                    <div class="switch-actions">
                        <button class="switch-btn main" data-server="main">
                            <span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--server-red-plus);display:inline-block;"></span>

    <div class="sticky-bottom-banner" id="stickyBottomBanner">
        <div class="sticky-banner-header">
            <span class="sticky-banner-label">Sponsored</span>
        </div>
        <div class="sticky-banner-content" id="stickyAdContent">
            <script>
                atOptions = {
                    'key': '4a5f21676e17448c3ce7697746d1287c',
                    'format': 'iframe',
                    'height': 50,
                    'width': 320,
                    'params': {}
                };
            </script>
            <script src="https://www.highrevenueformat.com/4a5f21676e17448c3ce7697746d1287c/invoke.js"></script>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        //  SAME SERVER API AS HOME PAGE — no TMDB key needed
        // ============================================================
        const API = "/api";
        const OMDB_API_KEY = 'df7d5111';
        const OMDB_BASE    = 'https://www.omdbapi.com/';

        // ============================================================
        //  SERVERS
        // ============================================================
        const SERVERS = {
            main: {
                name: 'Red +',
                requiresOmdb: false,
                url: (tmdbId, omdbId, type, season, episode) => {
                    if (!tmdbId) return null;
                    if (type === 'movie') {
                        return `https://vidstuck.xyz/embed/movie/${tmdbId}?branding=RX+Player&loading=1&back=false`;
                    }
                    const s = season || 1;
                    const e = episode || 1;
                    return `https://vidstuck.xyz/embed/tv/${tmdbId}/${s}/${e}?branding=RX+Player&loading=1&back=false`;
                }
            },
            red: {
                name: 'Red',
                requiresOmdb: true,
                url: (tmdbId, omdbId, type, season, episode) => {
                    if (!omdbId) return null;
                    if (type === 'movie') {
                        return `https://autoembed.co/movie/imdb/${omdbId}`;
                    }
                    const s = season || 1;
                    const e = episode || 1;
                    return `https://autoembed.co/tv/imdb/${omdbId}-${s}-${e}`;
                }
            },
            green: {
                name: 'Green',
                requiresOmdb: true,
                url: (tmdbId, omdbId, type, season, episode) => {
                    if (!omdbId) return null;
                    return `https://kriss424did.com/play/${omdbId}`;
                }
            }
        };

        // ============================================================
        //  STATE
        // ============================================================
        let currentTmdbId = null;
        let currentOmdbId = null;
        let currentType = 'movie';
        let currentServer = 'main';
        let currentSeason = 1;
        let currentEpisode = 1;
        let totalSeasons = 1;
        let seasonList = [];
        let episodeList = [];
        let metadata = null;
        let isIssueOverlayShown = false;
        let isPaused = false;

        // ============================================================
        //  HELPERS
        // ============================================================
        function isTvType(t) {
            if (!t) return false;
            t = String(t).toLowerCase();
            return t === 'tv' || t === 'series' || t === 'anime' || t === 'show';
        }
        function isSeries() { return currentType === 'tv'; }

        function toggleContainerFullscreen() {
            const playerWrapper = document.getElementById('playerWrapper');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (playerWrapper.requestFullscreen) playerWrapper.requestFullscreen();
                else if (playerWrapper.webkitRequestFullscreen) playerWrapper.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
        function updateFsButtonState() {
            const fsIcon = document.getElementById('fsIcon');
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
            fsIcon.className = isFs ? 'fas fa-compress' : 'fas fa-expand';
        }
        document.addEventListener('fullscreenchange', updateFsButtonState);
        document.addEventListener('webkitfullscreenchange', updateFsButtonState);

        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const icons = { info: 'fa-info-circle', success: 'fa-check-circle', error: 'fa-exclamation-circle' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon"><i class="fas ${icons[type] || icons.info}"></i></span>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================================
        //  SERVER API REQUEST (same as home page)
        // ============================================================
        async function apiRequest(url) {
            try {
                const res = await fetch(API + url);
                const data = await res.json();
                if (!res.ok || data.success === false) {
                    throw new Error(data.error || "Request failed");
                }
                return data;
            } catch (e) {
                console.warn('API error:', url, e.message);
                return null;
            }
        }

        /** TMDB proxy helper — same as home page */
        async function tmdbProxy(endpoint) {
            const data = await apiRequest(`/tmdb-proxy?endpoint=${encodeURIComponent(endpoint)}`);
            return data;
        }

        /** Fetch details from /api/details — same as home page */
        async function fetchDetailsFromApi(id, type) {
            const data = await apiRequest(`/details?id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}`);
            if (data && data.details) return data.details;
            return null;
        }

        /** Fetch TV season episodes from tmdb-proxy */
        async function fetchSeasonEpisodes(tmdbId, seasonNumber) {
            const data = await tmdbProxy(`/tv/${tmdbId}/season/${seasonNumber}`);
            if (data && Array.isArray(data.episodes)) {
                return data.episodes.map(ep => ({
                    episode_number: ep.episode_number,
                    name: ep.name || ''
                }));
            }
            return null;
        }

        /** Find TMDB id by IMDb id via tmdb-proxy */
        async function findTmdbByImdb(imdbId) {
            if (!imdbId) return null;
            const data = await tmdbProxy(`/find/${imdbId}?external_source=imdb_id`);
            if (!data) return null;
            if (Array.isArray(data.tv_results) && data.tv_results.length) {
                return { id: data.tv_results[0].id, type: 'tv' };
            }
            if (Array.isArray(data.movie_results) && data.movie_results.length) {
                return { id: data.movie_results[0].id, type: 'movie' };
            }
            return null;
        }

        // ============================================================
        //  OMDb FALLBACK
        // ============================================================
        async function fetchOmdbById(imdbId) {
            if (!imdbId) return null;
            try {
                const res = await fetch(`${OMDB_BASE}?apikey=${OMDB_API_KEY}&i=${imdbId}&plot=full`);
                const data = await res.json();
                return data.Response === 'True' ? data : null;
            } catch (e) {
                console.warn('OMDb fetch error:', e.message);
                return null;
            }
        }

        async function fetchOmdbEpisodes(imdbId, season) {
            try {
                const res = await fetch(`${OMDB_BASE}?apikey=${OMDB_API_KEY}&i=${imdbId}&Season=${season}`);
                const data = await res.json();
                if (data.Response === 'True' && data.Episodes) {
                    return data.Episodes.map(e => ({
                        episode_number: parseInt(e.Episode, 10),
                        name: e.Title || ''
                    })).filter(e => !isNaN(e.episode_number));
                }
                return null;
            } catch (e) {
                console.warn('Failed to fetch OMDb episodes:', e.message);
                return null;
            }
        }

        // ============================================================
        //  METADATA APPLIERS
        // ============================================================
        function applyTmdbMetadata(d, type) {
            const isTv = type === 'tv';
            metadata = d;
            currentType = isTv ? 'tv' : 'movie';

            // Details endpoint me imdb_id directly aa sakta hai
            if (d.imdb_id) {
                currentOmdbId = d.imdb_id;
            } else if (d.external_ids && d.external_ids.imdb_id) {
                currentOmdbId = d.external_ids.imdb_id;
            }

            document.getElementById('movieTitle').textContent = d.title || d.name || 'Untitled';
            document.getElementById('movieType').textContent = isTv ? 'series' : 'movie';

            const dateStr = d.release_date || d.first_air_date || '';
            document.getElementById('movieYear').textContent = dateStr ? dateStr.slice(0, 4) : '—';

            document.getElementById('movieRating').innerHTML =
                `<i class="fas fa-star"></i> ${d.vote_average ? Number(d.vote_average).toFixed(1) : '—'}`;

            let runtime = '—';
            if (isTv) {
                const epRun = Array.isArray(d.episode_run_time) && d.episode_run_time.length ? d.episode_run_time[0] : null;
                if (epRun) runtime = `${epRun} min/ep`;
                else if (d.number_of_episodes) runtime = `${d.number_of_episodes} eps`;
            } else {
                runtime = d.runtime ? `${d.runtime} min` : '—';
            }
            document.getElementById('movieRuntime').textContent = runtime;

            // Genres — details endpoint me array ya comma string ho sakta hai
            let genreText = '—';
            if (Array.isArray(d.genres)) {
                genreText = d.genres.map(g => g.name || g).join(', ');
            } else if (typeof d.genres === 'string') {
                genreText = d.genres;
            } else if (typeof d.Genre === 'string') {
                genreText = d.Genre;
            }
            document.getElementById('movieGenre').textContent = genreText || '—';

            document.getElementById('moviePlot').textContent = d.overview || d.Plot || 'No description available.';

            if (isTv) {
                seasonList = (d.seasons || [])
                    .filter(s => s.season_number >= 1)
                    .map(s => ({
                        season_number: s.season_number,
                        name: s.name || `Season ${s.season_number}`,
                        episode_count: s.episode_count || 0
                    }));
                totalSeasons = seasonList.length || d.number_of_seasons || 1;
            } else {
                seasonList = [];
                totalSeasons = 0;
            }
        }

        function applyOmdbMetadata(data) {
            if (!data) return;
            metadata = data;
            document.getElementById('movieTitle').textContent = data.Title || 'Untitled';
            document.getElementById('movieType').textContent = isSeries() ? 'series' : 'movie';
            document.getElementById('movieYear').textContent = data.Year || '—';
            document.getElementById('movieRating').innerHTML =
                `<i class="fas fa-star"></i> ${data.imdbRating || '—'}`;
            document.getElementById('movieRuntime').textContent = data.Runtime || '—';
            document.getElementById('movieGenre').textContent = data.Genre || '—';
            document.getElementById('moviePlot').textContent = data.Plot || 'No description available.';

            if (isSeries()) {
                totalSeasons = parseInt(data.totalSeasons, 10) || 1;
                seasonList = [];
            }
        }

        // ============================================================
        //  DROPDOWNS
        // ============================================================
        function populateSeasonDropdown() {
            const select = document.getElementById('seasonSelect');
            select.innerHTML = '';

            let list = seasonList.slice();
            if (!list.length) {
                const count = totalSeasons > 0 ? totalSeasons : 1;
                for (let i = 1; i <= count; i++) {
                    list.push({ season_number: i, name: `Season ${i}`, episode_count: 0 });
                }
            }

            list.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.season_number;
                opt.textContent = s.name || `Season ${s.season_number}`;
                select.appendChild(opt);
            });
        }

        async function loadEpisodes(seasonNumber) {
            const select = document.getElementById('episodeSelect');
            select.innerHTML = '<option value="">Loading…</option>';
            select.disabled = true;

            let eps = null;

            // 1) TMDB proxy (server) — same as home page
            if (currentTmdbId) {
                eps = await fetchSeasonEpisodes(currentTmdbId, seasonNumber);
            }
            // 2) OMDb fallback
            if ((!eps || !eps.length) && currentOmdbId) {
                eps = await fetchOmdbEpisodes(currentOmdbId, seasonNumber);
            }
            // 3) Fallback: build from metadata episode_count
            if (!eps || !eps.length) {
                const seasonMeta = seasonList.find(s => s.season_number === seasonNumber);
                const count = seasonMeta && seasonMeta.episode_count ? seasonMeta.episode_count : 1;
                eps = [];
                for (let i = 1; i <= count; i++) eps.push({ episode_number: i, name: '' });
            }

            episodeList = eps;
            select.disabled = false;
            select.innerHTML = '';

            eps.forEach(ep => {
                const opt = document.createElement('option');
                opt.value = ep.episode_number;
                let name = ep.name || '';
                if (name.length > 45) name = name.slice(0, 42) + '…';
                opt.textContent = name ? `Ep ${ep.episode_number} — ${name}` : `Episode ${ep.episode_number}`;
                select.appendChild(opt);
            });

            const exists = Array.from(select.options)
                .some(o => parseInt(o.value, 10) === parseInt(currentEpisode, 10));
            if (!exists) currentEpisode = parseInt(select.options[0].value, 10) || 1;
            select.value = currentEpisode;

            return episodeList;
        }

        // ============================================================
        //  URL SYNC
        // ============================================================
        function updateUrl() {
            const params = new URLSearchParams(window.location.search);
            if (currentTmdbId) params.set('id', currentTmdbId);
            else if (currentOmdbId) params.set('id', currentOmdbId);
            else params.delete('id');

            if (currentOmdbId) params.set('omdbId', currentOmdbId);
            else params.delete('omdbId');

            params.set('type', isSeries() ? 'tv' : 'movie');

            if (isSeries()) {
                params.set('season', currentSeason);
                params.set('episode', currentEpisode);
            } else {
                params.delete('season');
                params.delete('episode');
            }

            try {
                const newUrl = `${window.location.pathname}?${params.toString()}`;
                window.history.replaceState(null, '', newUrl);
            } catch (e) {}
        }

        // ============================================================
        //  PLAYER
        // ============================================================
        function buildPlayerUrl(server, tmdbId, omdbId, type, season, episode) {
            const fn = SERVERS[server];
            if (!fn) return null;
            try { return fn.url(tmdbId, omdbId, type, season, episode); }
            catch (e) { console.error('URL build error:', e); return null; }
        }

        function syncServerButtons() {
            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.server === currentServer);
            });
        }

        function loadPlayer() {
            const iframe = document.getElementById('playerIframe');
            const overlay = document.getElementById('serverIssueOverlay');

            hidePauseAds();
            overlay.classList.remove('visible');
            isIssueOverlayShown = false;

            if (!currentTmdbId && !currentOmdbId) {
                showToast('No content ID provided.', 'error');
                return;
            }

            if (SERVERS[currentServer].requiresOmdb && !currentOmdbId) {
                if (currentTmdbId) {
                    showToast('Switching to Red + server (needs TMDB ID).', 'info', 3500);
                    currentServer = 'main';
                } else {
                    showToast('Red/Green servers need an OMDb (IMDb) ID.', 'error', 4000);
                    return;
                }
            }
            if (currentServer === 'main' && !currentTmdbId) {
                if (currentOmdbId) {
                    showToast('Switching to Red server (needs IMDb ID).', 'info', 3500);
                    currentServer = 'red';
                } else {
                    showToast('No TMDB ID available for Red + server.', 'error', 4000);
                    return;
                }
            }

            const url = buildPlayerUrl(currentServer, currentTmdbId, currentOmdbId, currentType, currentSeason, currentEpisode);
            if (!url) { showToast('Failed to build player URL.', 'error'); return; }

            iframe.style.display = 'block';
            iframe.src = url;

            iframe.onload = () => {
                overlay.classList.remove('visible');
                isIssueOverlayShown = false;
                isPaused = false;
                hidePauseAds();
            };

            syncServerButtons();
            document.getElementById('episodeControls').classList.toggle('visible', isSeries());
            updateUrl();

            const epLabel = isSeries() ? ` • S${currentSeason}E${currentEpisode}` : '';
            showToast(`🔴 ${SERVERS[currentServer].name} server loading${epLabel}…`, 'success', 2000);
        }

        // ============================================================
        //  PAUSE ADS
        // ============================================================
        function loadPauseAdScript() {
            const adCode = `
                <script>
                    atOptions = { 'key' : 'c858000fd6435f9dbc23628e60fdc3cb', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
                <\/script>
                <script src="https://www.highrevenueformat.com/c858000fd6435f9dbc23628e60fdc3cb/invoke.js"><\/script>
            `;
            document.getElementById('pauseAdTopInner').innerHTML = adCode;
            document.getElementById('pauseAdBottomInner').innerHTML = adCode;
        }
        function showPauseAds() {
            document.getElementById('pauseAdTop').classList.add('visible');
            document.getElementById('pauseAdBottom').classList.add('visible');
            document.getElementById('pauseBadge').classList.add('visible');
            isPaused = true;
        }
        function hidePauseAds() {
            document.getElementById('pauseAdTop').classList.remove('visible');
            document.getElementById('pauseAdBottom').classList.remove('visible');
            document.getElementById('pauseBadge').classList.remove('visible');
            isPaused = false;
        }
        function togglePauseAds() {
            if (isPaused) { hidePauseAds(); sendPlayCommand(); }
            else { showPauseAds(); sendPauseCommand(); }
        }
        function sendPauseCommand() {
            const iframe = document.getElementById('playerIframe');
            if (iframe && iframe.contentWindow) {
                try {
                    iframe.contentWindow.postMessage({ command: 'pause', method: 'pause' }, '*');
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo' }), '*');
                    iframe.contentWindow.postMessage({ action: 'pause' }, '*');
                    iframe.contentWindow.postMessage('pause', '*');
                } catch (e) {}
            }
        }
        function sendPlayCommand() {
            const iframe = document.getElementById('playerIframe');
            if (iframe && iframe.contentWindow) {
                try {
                    iframe.contentWindow.postMessage({ command: 'play', method: 'play' }, '*');
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo' }), '*');
                    iframe.contentWindow.postMessage({ action: 'play' }, '*');
                    iframe.contentWindow.postMessage('play', '*');
                } catch (e) {}
            }
        }

        function switchServer(server) {
            currentServer = server;
            loadPlayer();
            document.getElementById('serverIssueOverlay').classList.remove('visible');
            isIssueOverlayShown = false;
        }

        function handleKeydown(e) {
            const key = e.key;
            if (key === ' ' || key === 'Spacebar' || key === 'Space') {
                e.preventDefault(); e.stopPropagation();
                const iframe = document.getElementById('playerIframe');
                if (iframe && iframe.style.display !== 'none') togglePauseAds();
            }
            if (key === 'f' || key === 'F') { e.preventDefault(); toggleContainerFullscreen(); }
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            const params = new URLSearchParams(window.location.search);
            const rawId = params.get('id');
            const omdbParam = params.get('omdbId') || params.get('imdbId');
            const typeParam = (params.get('type') || 'movie').toLowerCase();

            loadPauseAdScript();

            console.log('🎬 RX Player init — using server API:', API);

            let tmdbId = null;
            let omdbId = omdbParam || null;

            if (rawId) {
                if (/^tt\d+$/i.test(rawId)) { if (!omdbId) omdbId = rawId; }
                else { tmdbId = rawId; }
            }

            if (!tmdbId && !omdbId) {
                document.getElementById('movieTitle').textContent = 'No content specified';
                document.getElementById('moviePlot').textContent = 'Please provide an ID in the URL.';
                showToast('Missing content ID.', 'error', 4000);
                return;
            }

            currentType = isTvType(typeParam) ? 'tv' : 'movie';
            currentTmdbId = tmdbId;
            currentOmdbId = omdbId;

            // Agar sirf IMDb id hai to TMDB id dhundho (proxy ke through)
            if (!currentTmdbId && currentOmdbId) {
                const found = await findTmdbByImdb(currentOmdbId);
                if (found) { currentTmdbId = found.id; currentType = found.type; }
            }

            // ---- Fetch details from server API (same as home page) ----
            let tmdbData = null;
            if (currentTmdbId) {
                tmdbData = await fetchDetailsFromApi(currentTmdbId, currentType);
                // Agar type galat tha to try other
                if (!tmdbData || (!tmdbData.title && !tmdbData.name)) {
                    const other = currentType === 'tv' ? 'movie' : 'tv';
                    const alt = await fetchDetailsFromApi(currentTmdbId, other);
                    if (alt && (alt.title || alt.name)) {
                        tmdbData = alt;
                        currentType = other;
                    }
                }
            }

            if (tmdbData) {
                console.log('✅ Details loaded:', tmdbData.title || tmdbData.name);
                applyTmdbMetadata(tmdbData, currentType);
            } else if (currentOmdbId) {
                console.warn('⚠️ Details API failed. Trying OMDb...');
                const omdbData = await fetchOmdbById(currentOmdbId);
                if (omdbData) {
                    currentType = isTvType(omdbData.Type) ? 'tv' : 'movie';
                    if (omdbData.imdbID) currentOmdbId = omdbData.imdbID;
                    applyOmdbMetadata(omdbData);
                } else {
                    document.getElementById('movieTitle').textContent = 'RX Player Content';
                    document.getElementById('moviePlot').textContent = 'Streaming via Red + Server.';
                }
            } else {
                document.getElementById('movieTitle').textContent = 'RX Player Content';
                document.getElementById('moviePlot').textContent = 'Streaming via Red + Server.';
            }

            // ---- Seasons / Episodes setup ----
            const seasonSelect = document.getElementById('seasonSelect');
            const episodeSelect = document.getElementById('episodeSelect');

            if (isSeries()) {
                document.getElementById('episodeControls').classList.add('visible');

                populateSeasonDropdown();

                const seasonParam = parseInt(params.get('season'), 10);
                const seasonExists = !isNaN(seasonParam) &&
                    Array.from(seasonSelect.options).some(o => parseInt(o.value, 10) === seasonParam);

                currentSeason = seasonExists ? seasonParam : (parseInt(seasonSelect.value, 10) || 1);
                seasonSelect.value = currentSeason;

                currentEpisode = parseInt(params.get('episode'), 10) || 1;
                await loadEpisodes(currentSeason);

                const epExists = !isNaN(currentEpisode) &&
                    Array.from(episodeSelect.options).some(o => parseInt(o.value, 10) === currentEpisode);
                if (!epExists) currentEpisode = parseInt(episodeSelect.value, 10) || 1;
                episodeSelect.value = currentEpisode;
            } else {
                document.getElementById('episodeControls').classList.remove('visible');
                currentSeason = 1;
                currentEpisode = 1;
            }

            loadPlayer();

            // ===== EVENT LISTENERS =====
            document.getElementById('customFsBtn').addEventListener('click', function(e) {
                toggleContainerFullscreen();
                e.stopPropagation();
            });

            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const server = btn.dataset.server;
                    if (server === currentServer) { loadPlayer(); return; }
                    currentServer = server;
                    loadPlayer();
                });
            });

            document.getElementById('serverIssueTrigger').addEventListener('click', () => {
                const overlay = document.getElementById('serverIssueOverlay');
                overlay.classList.toggle('visible');
                isIssueOverlayShown = overlay.classList.contains('visible');
                if (isIssueOverlayShown) showToast('🔄 Select a different server or wait.', 'info', 3000);
            });

            document.querySelectorAll('.server-issue-overlay .switch-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const server = btn.dataset.server;
                    if (server) switchServer(server);
                });
            });

            // Season change -> Ep 1 of that season
            seasonSelect.addEventListener('change', async () => {
                currentSeason = parseInt(seasonSelect.value, 10) || 1;
                currentEpisode = 1;
                await loadEpisodes(currentSeason);
                currentEpisode = parseInt(episodeSelect.value, 10) || 1;
                loadPlayer();
                showToast(`📺 Season ${currentSeason}, Episode ${currentEpisode}`, 'info', 2200);
            });

            episodeSelect.addEventListener('change', () => {
                currentEpisode = parseInt(episodeSelect.value, 10) || 1;
                loadPlayer();
                showToast(`▶️ Season ${currentSeason}, Episode ${currentEpisode}`, 'info', 2000);
            });

            document.getElementById('applyEpBtn').addEventListener('click', () => {
                currentSeason = parseInt(seasonSelect.value, 10) || 1;
                currentEpisode = parseInt(episodeSelect.value, 10) || 1;
                loadPlayer();
                showToast(`Season ${currentSeason}, Episode ${currentEpisode} loaded`, 'success', 2000);
            });

            const header = document.getElementById('mainHeader');
            window.addEventListener('scroll', () => {
                header.classList.toggle('scrolled', window.scrollY > 10);
            });

            document.getElementById('profileBtn').addEventListener('click', () => {
                showToast('👤 Profile — Demo mode', 'info', 3000);
            });

            document.addEventListener('keydown', handleKeydown);

            const playerWrapper = document.getElementById('playerWrapper');
            playerWrapper.addEventListener('click', function(e) {
                const target = e.target;
                if (target === this || target.closest('.pause-ad-overlay') || target.closest('.pause-badge')) {
                    const iframe = document.getElementById('playerIframe');
                    if (iframe && iframe.style.display !== 'none') togglePauseAds();
                }
            });

            document.getElementById('pauseBadge').addEventListener('click', function(e) {
                e.stopPropagation();
                togglePauseAds();
            });

            window.addEventListener('message', function(event) {
                let data = event.data;
                if (typeof data === 'string') {
                    try { data = JSON.parse(data); } catch (e) {}
                }
                if (data) {
                    if (data.event === 'onStateChange' && data.info === 2) { showPauseAds(); return; }
                    if (data.event === 'onStateChange' && data.info === 1) { hidePauseAds(); return; }
                    if (data.event === 'pause') { showPauseAds(); return; }
                    if (data.event === 'play') { hidePauseAds(); return; }
                    if (data.type === 'pause' || data.action === 'pause' || data.method === 'pause') { showPauseAds(); return; }
                    if (data.type === 'play' || data.action === 'play' || data.method === 'play' || data.type === 'playing') { hidePauseAds(); return; }
                    if (data.paused === true) { showPauseAds(); return; }
                    if (data.paused === false) { hidePauseAds(); return; }
                }
            });

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) hidePauseAds();
            });
        }

        document.addEventListener('DOMContentLoaded', init);

        window.addEventListener('error', (e) => console.error('Uncaught error:', e.message));

        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        document.addEventListener('keydown', function(e) {
            const key = e.keyCode || e.which;
            if (key === 123) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (key === 73 || key === 74 || key === 67)) { e.preventDefault(); return false; }
            if (e.ctrlKey && (key === 85 || key === 83)) { e.preventDefault(); return false; }
            if (e.metaKey && e.altKey && key === 73) { e.preventDefault(); return false; }
            if (key === 44) { e.preventDefault(); return false; }
            return true;
        });
        document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });
        document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
    </script>
</body>
</html>
