<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RX PLAYER — Watch</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-red: #E50914;
            --bg-primary: #0A0A0F;
            --bg-card: #1A1A24;
            --bg-secondary: #14141C;
            --text-white: #FFFFFF;
            --text-muted: #A0A0AA;
            --shadow: 0 12px 48px rgba(0, 0, 0, 0.7);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --header-height: 62px;
            --sticky-banner-height: 70px;
            --server-green: #22C55E;
            --server-red: #EF4444;
            --server-red-plus: #FF1E38;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-white);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding-top: var(--header-height);
            padding-bottom: var(--sticky-banner-height);
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            cursor: pointer;
            font-family: var(--font);
            border: none;
            background: none;
            color: inherit;
        }
        img {
            display: block;
            max-width: 100%;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-secondary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-red);
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--bg-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 10px 0;
            height: var(--header-height);
            display: flex;
            align-items: center;
            transition: var(--transition);
        }
        .header.scrolled {
            background: var(--bg-primary);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
        }
        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .logo span {
            color: var(--primary-red);
        }
        .logo i {
            color: var(--primary-red);
            font-size: 18px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-actions .back-btn {
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.06);
            font-size: 13px;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-actions .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .header-actions .profile-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: var(--transition);
            border: 2px solid transparent;
        }
        .header-actions .profile-btn:hover {
            border-color: var(--primary-red);
        }

        /* ===== PLAYER ROW ===== */
        .player-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .player-wrapper {
            flex: 1;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            width: 100%;
            max-height: 75vh;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .player-wrapper:fullscreen {
            max-height: 100vh;
            width: 100vw;
            border-radius: 0;
            border: none;
            aspect-ratio: auto;
        }
        .player-wrapper:-webkit-full-screen {
            max-height: 100vh;
            width: 100vw;
            border-radius: 0;
            border: none;
            aspect-ratio: auto;
        }
        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: relative;
            z-index: 1;
        }

        /* ===== PAUSE AD OVERLAYS ===== */
        .pause-ad-overlay {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 8px 12px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .pause-ad-overlay.visible {
            display: flex;
            pointer-events: auto;
        }
        .pause-ad-overlay.top {
            top: 0;
            min-height: 100px;
            border-bottom: 2px solid rgba(229, 9, 20, 0.3);
        }
        .pause-ad-overlay.bottom {
            bottom: 0;
            min-height: 100px;
            border-top: 2px solid rgba(229, 9, 20, 0.3);
        }
        .pause-ad-overlay .ad-inner {
            width: 100%;
            max-width: 728px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }
        .pause-ad-overlay .ad-inner iframe {
            max-width: 100%;
            border: none;
            border-radius: 4px;
        }
        .pause-ad-overlay .ad-label {
            position: absolute;
            top: 2px;
            right: 8px;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 8px;
            border-radius: 10px;
            pointer-events: none;
        }
        .pause-ad-overlay .ad-label i {
            margin-right: 4px;
            font-size: 8px;
        }

        .pause-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 50%;
            width: 72px;
            height: 72px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .pause-badge.visible {
            display: flex;
        }
        .pause-badge i {
            font-size: 32px;
            color: #fff;
            opacity: 0.8;
        }

        /* ===== TOP-RIGHT BRANDING (PERMANENT - NO FADE) ===== */
        .player-branding {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(10, 10, 15, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            user-select: none;
            min-width: 110px;
            justify-content: center;
            opacity: 1 !important;
            visibility: visible !important;
        }
        .player-branding i {
            color: var(--primary-red);
            margin-right: 4px;
        }
        .player-branding span {
            color: var(--primary-red);
        }

        /* ===== CUSTOM FULLSCREEN BUTTON (PERMANENT - NO FADE) ===== */
        .custom-fs-btn {
            position: absolute;
            bottom: 20px;
            right: 12px;
            z-index: 2147483647;
            background: #0B0B12;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.9);
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .custom-fs-btn:hover {
            background: var(--primary-red);
            border-color: var(--primary-red);
            transform: scale(1.05);
        }

        /* ===== SERVER ISSUE OVERLAY ===== */
        .server-issue-overlay {
            position: absolute;
            inset: 0;
            z-index: 6;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            gap: 16px;
        }
        .server-issue-overlay.visible {
            display: flex;
        }
        .server-issue-overlay .icon {
            font-size: 48px;
            color: var(--server-red);
            opacity: 0.8;
        }
        .server-issue-overlay h3 {
            font-size: 22px;
            font-weight: 700;
        }
        .server-issue-overlay p {
            color: var(--text-muted);
            max-width: 440px;
            font-size: 15px;
        }
        .server-issue-overlay .switch-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }
        .server-issue-overlay .switch-btn {
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            transition: var(--transition);
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
        }
        .server-issue-overlay .switch-btn:hover {
            transform: scale(1.05);
        }
        .server-issue-overlay .switch-btn.main {
            color: var(--server-red-plus);
            border-color: var(--server-red-plus);
        }
        .server-issue-overlay .switch-btn.main:hover {
            background: rgba(255, 30, 56, 0.15);
        }
        .server-issue-overlay .switch-btn.red {
            color: var(--server-red);
            border-color: var(--server-red);
        }
        .server-issue-overlay .switch-btn.red:hover {
            background: rgba(239, 68, 68, 0.15);
        }
        .server-issue-overlay .switch-btn.green {
            color: var(--server-green);
            border-color: var(--server-green);
        }
        .server-issue-overlay .switch-btn.green:hover {
            background: rgba(34, 197, 94, 0.15);
        }

        /* ==============================================================
               AD CONTAINER — DESKTOP (IFRAME ad.html)
            ============================================================== */
        .ad-banner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 12px 10px;
            width: 100%;
        }
        .ad-banner-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 8px;
            width: 100%;
            text-align: left;
        }
        .ad-iframe-frame {
            width: 100%;
            height: 250px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            display: block;
        }

        .ad-desktop {
            flex: 0 0 340px;
            max-width: 340px;
        }

        /* ==============================================================
               MOBILE: STACKED BANNER (IFRAME ad.html)
            ============================================================== */
        .ad-mobile-stack {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            width: 100%;
            max-width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
        }
        .ad-mobile-stack .ad-iframe-frame {
            height: 140px;
        }

        /* ===== PLAYER INFO, CONTROLS, PLOT ===== */
        .player-info {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            align-items: flex-start;
            justify-content: space-between;
        }
        .player-info .title-section h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .player-info .title-section .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .player-info .title-section .meta .type-badge {
            text-transform: capitalize;
            padding: 2px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            font-size: 12px;
            font-weight: 600;
        }
        .player-info .title-section .meta .year {
            color: var(--text-muted);
        }
        .player-info .title-section .meta .rating {
            color: #F5C518;
            font-weight: 600;
        }
        .player-info .title-section .meta .rating i {
            font-size: 12px;
        }

        .server-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
        }
        .server-controls .server-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 6px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .server-btn {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            transition: var(--transition);
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .server-btn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .server-btn.main {
            color: var(--server-red-plus);
        }
        .server-btn.main .dot {
            background: var(--server-red-plus);
        }
        .server-btn.main.active {
            background: rgba(255, 30, 56, 0.15);
            border-color: var(--server-red-plus);
        }
        .server-btn.red {
            color: var(--server-red);
        }
        .server-btn.red .dot {
            background: var(--server-red);
        }
        .server-btn.red.active {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--server-red);
        }
        .server-btn.green {
            color: var(--server-green);
        }
        .server-btn.green .dot {
            background: var(--server-green);
        }
        .server-btn.green.active {
            background: rgba(34, 197, 94, 0.15);
            border-color: var(--server-green);
        }
        .server-btn:not(.active) {
            opacity: 0.5;
        }
        .server-btn:not(.active):hover {
            opacity: 0.8;
        }

        .server-issue-trigger {
            padding: 6px 14px;
            border-radius: 30px;
            background: rgba(239, 68, 68, 0.08);
            color: var(--server-red);
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.15);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .server-issue-trigger:hover {
            background: rgba(239, 68, 68, 0.15);
        }

        .episode-controls {
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .episode-controls.visible {
            display: flex;
        }
        .episode-controls label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .episode-controls select {
            padding: 6px 12px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-white);
            font-size: 13px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            font-family: var(--font);
            min-width: 60px;
        }
        .episode-controls select:focus {
            border-color: var(--primary-red);
        }
        .episode-controls select option {
            background: var(--bg-secondary);
            color: var(--text-white);
        }
        .episode-controls .apply-btn {
            padding: 6px 20px;
            border-radius: 30px;
            background: var(--primary-red);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            transition: var(--transition);
        }
        .episode-controls .apply-btn:hover {
            background: #b20710;
            transform: scale(1.04);
        }

        .plot-section {
            margin-top: 14px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--primary-red);
        }
        .plot-section p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.7;
        }
        .plot-section .plot-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        /* ===== STICKY BOTTOM BANNER ===== */
        .sticky-bottom-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 12px 8px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.7);
            transition: var(--transition);
        }
        .sticky-banner-header {
            width: 100%;
            max-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2px;
        }
        .sticky-banner-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }
        .sticky-banner-content {
            width: 320px;
            height: 50px;
            max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 80px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border-left: 4px solid var(--primary-red);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.3s ease;
            font-size: 14px;
        }
        .toast.success {
            border-left-color: #22C55E;
        }
        .toast.error {
            border-left-color: var(--primary-red);
        }
        .toast .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            :root {
                --header-height: 56px;
            }
            .header {
                padding: 6px 0;
            }
            .logo {
                font-size: 18px;
            }
            .logo i {
                font-size: 15px;
            }
            .header-actions .back-btn {
                font-size: 12px;
                padding: 4px 12px;
            }
            .header-actions .profile-btn {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
            .player-section {
                padding: 10px 0 20px;
            }
            .player-row {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .player-wrapper {
                max-height: 55vh;
                border-radius: var(--radius-sm);
            }
            .ad-desktop {
                display: none;
            }
            .ad-mobile-stack {
                display: flex;
            }
            .player-branding {
                top: 8px;
                right: 8px;
                padding: 4px 10px;
                font-size: 10px;
                min-width: 90px;
            }
            .custom-fs-btn {
                bottom: 10px;
                right: 8px;
                width: 40px;
                height: 40px;
                font-size: 14px;
            }
            .player-info .title-section h1 {
                font-size: 18px;
            }
            .player-info .title-section .meta {
                font-size: 12px;
                gap: 8px;
            }
            .server-btn {
                font-size: 11px;
                padding: 4px 12px;
            }
            .server-controls .server-group {
                padding: 3px 4px;
            }
            .server-issue-trigger {
                font-size: 11px;
                padding: 4px 10px;
            }
            .episode-controls {
                padding: 8px 12px;
            }
            .episode-controls label {
                font-size: 12px;
            }
            .episode-controls select {

                atOptions = {

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        //  CONFIG
        // ============================================================
        const OMDB_API_KEY = 'df7d5111';
        const OMDB_BASE = 'https://www.omdbapi.com/';

        // ============================================================
        //  SERVERS
        //  - main (Red +) : uses the TMDB id
        //  - red / green  : use the OMDb / IMDb id
        // ============================================================
        const SERVERS = {
            main: {
                name: 'Red +',
                requiresOmdb: false,
                url: (tmdbId, omdbId, type, season, episode) => {
                    if (!tmdbId) return null;
                    if (type === 'movie') {
                        return `https://vidstuck.xyz/embed/movie/${tmdbId}?branding=RX+Player&loading=1&back=false`;
                    }
                    const s = season || 1;
                    const e = episode || 1;
                    return `https://vidstuck.xyz/embed/tv/${tmdbId}/${s}/${e}?branding=RX+Player&loading=1&back=false`;
                }
            },
            red: {
                name: 'Red',
                requiresOmdb: true,
                url: (tmdbId, omdbId, type, season, episode) => {
                    // Red server -> OMDb / IMDb id
                    if (!omdbId) return null;
                    if (type === 'movie') {
                        return `https://autoembed.co/movie/imdb/${Id}`;
                    }
                    const s = season || 1;
                    const e = episode || 1;
                    return `https://autoembed.co/tv/imdb/${Id}-${s}-${e}`;
                }
            },
            green: {
                name: 'Green',
                requiresOmdb: true,
                url: (tmdbId, omdbId, type, season, episode) => {
                    // Green server -> OMDb / IMDb id
                    if (!omdbId) return null;
                    return `https://kriss424did.com/play/${Id}`;
                }
            }
        };

        let currentTmdbId = null;
        let currentOmdbId = null;
        let currentType = 'movie';
        let currentServer = 'main';
        let currentSeason = 1;
        let currentEpisode = 1;
        let metadata = null;
        let isIssueOverlayShown = false;
        let isPaused = false;

        // ============================================================
        //  FULLSCREEN TOGGLE
        // ============================================================
        function toggleContainerFullscreen() {
            const playerWrapper = document.getElementById('playerWrapper');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (playerWrapper.requestFullscreen) {
                    playerWrapper.requestFullscreen();
                } else if (playerWrapper.webkitRequestFullscreen) {
                    playerWrapper.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function updateFsButtonState() {
            const fsIcon = document.getElementById('fsIcon');
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
            fsIcon.className = isFs ? 'fas fa-compress' : 'fas fa-expand';
        }

        document.addEventListener('fullscreenchange', updateFsButtonState);
        document.addEventListener('webkitfullscreenchange', updateFsButtonState);

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const icons = { info: 'fa-info-circle', success: 'fa-check-circle', error: 'fa-exclamation-circle' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon"><i class="fas ${icons[type] || icons.info}"></i></span>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================================
        //  OMDb API
        // ============================================================
        async function fetchOmdbById(imdbId) {
            if (!imdbId) return null;
            try {
                const res = await fetch(`${OMDB_BASE}?apikey=${OMDB_API_KEY}&i=${imdbId}&plot=full`);
                const data = await res.json();
                return data.Response === 'True' ? data : null;
            } catch (e) {
                console.warn('OMDb fetch error:', e.message);
                return null;
            }
        }

        async function fetchEpisodesForSeason(imdbId, season) {
            try {
                const res = await fetch(`${OMDB_BASE}?apikey=${OMDB_API_KEY}&i=${imdbId}&Season=${season}`);
                const data = await res.json();
                if (data.Response === 'True' && data.Episodes) {
                    return data.Episodes;
                }
                return null;
            } catch (e) {
                console.warn('Failed to fetch episodes:', e.message);
                return null;
            }
        }

        // ============================================================
        //  DROPDOWN POPULATORS
        // ============================================================
        function populateSeasonDropdown(totalSeasons) {
            const select = document.getElementById('seasonSelect');
            select.innerHTML = '';
            if (!totalSeasons || totalSeasons < 1) {
                select.innerHTML = '<option value="1">1</option>';
                return;
            }
            for (let i = 1; i <= totalSeasons; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                select.appendChild(opt);
            }
            if (currentSeason <= totalSeasons) {
                select.value = currentSeason;
            } else {
                select.value = 1;
                currentSeason = 1;
            }
        }

        async function loadEpisodes(imdbId, season) {
            const select = document.getElementById('episodeSelect');
            select.innerHTML = '<option value="">Loading…</option>';
            select.disabled = true;

            const episodes = await fetchEpisodesForSeason(imdbId, season);
            select.disabled = false;
            if (episodes && episodes.length > 0) {
                select.innerHTML = '';
                episodes.forEach(ep => {
                    const opt = document.createElement('option');
                    opt.value = ep.Episode;
                    opt.textContent = `Episode ${ep.Episode}`;
                    select.appendChild(opt);
                });
                const exists = Array.from(select.options).some(o => o.value == currentEpisode);
                if (exists) {
                    select.value = currentEpisode;
                } else {
                    select.value = select.options[0]?.value || 1;
                    currentEpisode = parseInt(select.value);
                }
            } else {
                select.innerHTML = '<option value="1">Episode 1</option>';
                select.value = 1;
                currentEpisode = 1;
                showToast(`Could not fetch episode list for Season ${season}.`, 'error', 3000);
            }
        }

        // ============================================================
        //  PLAYER
        // ============================================================
        function buildPlayerUrl(server, tmdbId, omdbId, type, season, episode) {
            const fn = SERVERS[server];
            if (!fn) return null;
            try {
                return fn.url(tmdbId, omdbId, type, season, episode);
            } catch (e) {
                console.error('URL build error:', e);
                return null;
            }
        }

        function syncServerButtons() {
            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.server === currentServer);
            });
        }

        function loadPlayer() {
            const iframe = document.getElementById('playerIframe');
            const overlay = document.getElementById('serverIssueOverlay');

            hidePauseAds();
            overlay.classList.remove('visible');
            isIssueOverlayShown = false;

            if (!currentTmdbId && !currentOmdbId) {
                showToast('No content ID provided.', 'error');
                return;
            }

            // ----- Fallbacks when a server does not have the ID it needs -----
            // Red / Green need the OMDb (IMDb) id.
            if (SERVERS[currentServer].requiresOmdb && !currentOmdbId) {
                if (currentTmdbId) {
                    showToast('Red/Green servers need an OMDb (IMDb) ID — switching to Red + server.', 'info', 3500);
                    currentServer = 'main';
                } else {
                    showToast('Red/Green servers need an OMDb (IMDb) ID.', 'error', 4000);
                    return;
                }
            }
            // Red + needs the TMDB id.
            if (currentServer === 'main' && !currentTmdbId) {
                if (currentOmdbId) {
                    showToast('Red + server needs a TMDB ID — switching to Red server.', 'info', 3500);
                    currentServer = 'red';
                } else {
                    showToast('No TMDB ID available for Red + server.', 'error', 4000);
                    return;
                }
            }

            const url = buildPlayerUrl(currentServer, currentTmdbId, currentOmdbId, currentType, currentSeason, currentEpisode);
            if (!url) {
                showToast('Failed to build player URL.', 'error');
                return;
            }

            iframe.style.display = 'block';
            iframe.src = url;

            iframe.onload = () => {
                overlay.classList.remove('visible');
                isIssueOverlayShown = false;
                isPaused = false;
                hidePauseAds();
            };

            syncServerButtons();

            const isSeries = currentType === 'series' || currentType === 'tv' || currentType === 'anime';
            document.getElementById('episodeControls').classList.toggle('visible', isSeries);

            showToast(`🔴 ${SERVERS[currentServer].name} server loading…`, 'success', 2000);
        }

        // ============================================================
        //  PAUSE AD CONTROLS
        // ============================================================
        function loadPauseAdScript() {
            const adCode = `
                <script>
                    atOptions = {
                        'key' : 'c858000fd6435f9dbc23628e60fdc3cb',
                        'format' : 'iframe',
                        'height' : 90,
                        'width' : 728,
                        'params' : {}
                    };
                <\/script>
                <script src="https://www.highrevenueformat.com/c858000fd6435f9dbc23628e60fdc3cb/invoke.js"><\/script>
            `;
            document.getElementById('pauseAdTopInner').innerHTML = adCode;
            document.getElementById('pauseAdBottomInner').innerHTML = adCode;
        }

        function showPauseAds() {
            document.getElementById('pauseAdTop').classList.add('visible');
            document.getElementById('pauseAdBottom').classList.add('visible');
            document.getElementById('pauseBadge').classList.add('visible');
            isPaused = true;
        }

        function hidePauseAds() {
            document.getElementById('pauseAdTop').classList.remove('visible');
            document.getElementById('pauseAdBottom').classList.remove('visible');
            document.getElementById('pauseBadge').classList.remove('visible');
            isPaused = false;
        }

        function togglePauseAds() {
            if (isPaused) {
                hidePauseAds();
                sendPlayCommand();
            } else {
                showPauseAds();
                sendPauseCommand();
            }
        }

        function sendPauseCommand() {
            const iframe = document.getElementById('playerIframe');
            if (iframe && iframe.contentWindow) {
                try {
                    iframe.contentWindow.postMessage({ command: 'pause', method: 'pause' }, '*');
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo' }), '*');
                    iframe.contentWindow.postMessage({ action: 'pause' }, '*');
                    iframe.contentWindow.postMessage('pause', '*');
                } catch (e) { /* ignore */ }
            }
        }

        function sendPlayCommand() {
            const iframe = document.getElementById('playerIframe');
            if (iframe && iframe.contentWindow) {
                try {
                    iframe.contentWindow.postMessage({ command: 'play', method: 'play' }, '*');
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo' }), '*');
                    iframe.contentWindow.postMessage({ action: 'play' }, '*');
                    iframe.contentWindow.postMessage('play', '*');
                } catch (e) { /* ignore */ }
            }
        }

        // ============================================================
        //  UPDATE UI
        // ============================================================
        function updateUIWithMetadata(data) {
            if (!data) return;
            document.getElementById('movieTitle').textContent = data.Title || 'Untitled';
            document.getElementById('movieType').textContent = data.Type || 'movie';
            document.getElementById('movieYear').textContent = data.Year || '—';
            document.getElementById('movieRating').innerHTML = `<i class="fas fa-star"></i> ${data.imdbRating || '—'}`;
            document.getElementById('movieRuntime').textContent = data.Runtime || '—';
            document.getElementById('movieGenre').textContent = data.Genre || '—';
            document.getElementById('moviePlot').textContent = data.Plot || 'No description available.';
        }

        function switchServer(server) {
            if (server === currentServer) {
                loadPlayer();
                return;
            }
            currentServer = server;
            loadPlayer();
            document.getElementById('serverIssueOverlay').classList.remove('visible');
            isIssueOverlayShown = false;
        }

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        function handleKeydown(e) {
            const key = e.key;
            if (key === ' ' || key === 'Spacebar' || key === 'Space') {
                e.preventDefault();
                e.stopPropagation();
                const iframe = document.getElementById('playerIframe');
                if (iframe && iframe.style.display !== 'none') {
                    togglePauseAds();
                }
            }
            if (key === 'f' || key === 'F') {
                e.preventDefault();
                toggleContainerFullscreen();
            }
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            const params = new URLSearchParams(window.location.search);
            const rawId = params.get('id');                                  // TMDB id (or a raw IMDb id)
            const omdbParam = params.get('omdbId') || params.get('imdbId');  // OMDb / IMDb id
            const type = params.get('type') || 'movie';

            loadPauseAdScript();

            // ---- Resolve the two IDs -------------------------------------
            // Red +  -> TMDB id   (the "show id")
            // Red    -> OMDb id   (the fetched / passed IMDb id)
            // Green  -> OMDb id   (the fetched / passed IMDb id)
            let tmdbId = null;
            let omdbId = omdbParam || null;

            if (rawId) {
                if (/^tt\d+$/i.test(rawId)) {
                    // The id itself is an IMDb id (2nd-code style link)
                    if (!omdbId) omdbId = rawId;
                } else {
                    // The id is a TMDB id (1st-code style link)
                    tmdbId = rawId;
                }
            }

            if (!tmdbId && !omdbId) {
                document.getElementById('movieTitle').textContent = 'No content specified';
                document.getElementById('moviePlot').textContent = 'Please provide an ID in the URL.';
                showToast('Missing content ID.', 'error', 4000);
                return;
            }

            currentTmdbId = tmdbId;
            currentOmdbId = omdbId;
            currentType = type;

            // If there is no TMDB id we cannot use Red +, so start on Red.
            if (!currentTmdbId && currentOmdbId) {
                currentServer = 'red';
                syncServerButtons();
            }

            try {
                // Fetch metadata using the OMDb id (if we have one)
                if (currentOmdbId) {
                    metadata = await fetchOmdbById(currentOmdbId);
                }

                if (metadata) {
                    updateUIWithMetadata(metadata);
                    if (metadata.Type) currentType = metadata.Type.toLowerCase();
                    // The OMDb id that comes back from the API is the one that
                    // replaces the "show id" for the Red / Green servers.
                    if (metadata.imdbID) {
                        currentOmdbId = metadata.imdbID;
                    }
                } else {
                    document.getElementById('movieTitle').textContent = 'RX Player Content';
                    document.getElementById('moviePlot').textContent = 'Streaming via Red + Server.';
                }
            } catch (e) {
                console.error('Metadata fetch error:', e);
            }

            const isSeries = currentType === 'series' || currentType === 'tv' || currentType === 'anime';
            if (isSeries && metadata && metadata.totalSeasons) {
                const totalSeasons = parseInt(metadata.totalSeasons) || 1;
                populateSeasonDropdown(totalSeasons);

                const seasonParam = params.get('season');
                if (seasonParam) {
                    const s = parseInt(seasonParam);
                    if (s >= 1 && s <= totalSeasons) currentSeason = s;
                } else {
                    currentSeason = 1;
                }
                document.getElementById('seasonSelect').value = currentSeason;

                if (currentOmdbId) {
                    await loadEpisodes(currentOmdbId, currentSeason);
                }

                const episodeParam = params.get('episode');
                if (episodeParam) {
                    const e = parseInt(episodeParam);
                    const select = document.getElementById('episodeSelect');
                    const exists = Array.from(select.options).some(o => o.value == e);
                    if (exists) {
                        currentEpisode = e;
                        select.value = e;
                    } else {
                        currentEpisode = parseInt(select.value);
                    }
                } else {
                    currentEpisode = parseInt(document.getElementById('episodeSelect').value) || 1;
                }
            } else if (isSeries) {
                populateSeasonDropdown(5);
                document.getElementById('seasonSelect').value = 1;
                const epSelect = document.getElementById('episodeSelect');
                epSelect.innerHTML = '<option value="1">Episode 1</option>';
            } else {
                document.getElementById('episodeControls').classList.remove('visible');
                const seasonParam = params.get('season');
                const episodeParam = params.get('episode');
                if (seasonParam) currentSeason = parseInt(seasonParam) || 1;
                if (episodeParam) currentEpisode = parseInt(episodeParam) || 1;
            }

            loadPlayer();

            // ===== EVENT LISTENERS =====
            document.getElementById('customFsBtn').addEventListener('click', function(e) {
                toggleContainerFullscreen();
                e.stopPropagation();
            });

            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const server = btn.dataset.server;
                    if (server === currentServer) {
                        loadPlayer();
                        return;
                    }
                    currentServer = server;
                    loadPlayer();
                });
            });

            document.getElementById('serverIssueTrigger').addEventListener('click', () => {
                const overlay = document.getElementById('serverIssueOverlay');
                overlay.classList.toggle('visible');
                isIssueOverlayShown = overlay.classList.contains('visible');
                if (isIssueOverlayShown) {
                    showToast('🔄 Select a different server or wait.', 'info', 3000);
                }
            });

            document.querySelectorAll('.server-issue-overlay .switch-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const server = btn.dataset.server;
                    if (server) switchServer(server);
                });
            });

            const seasonSelect = document.getElementById('seasonSelect');
            const episodeSelect = document.getElementById('episodeSelect');

            seasonSelect.addEventListener('change', async () => {
                const s = parseInt(seasonSelect.value) || 1;
                currentSeason = s;
                if (currentOmdbId) {
                    await loadEpisodes(currentOmdbId, s);
                }
                const firstEp = parseInt(episodeSelect.value);
                if (!isNaN(firstEp)) {
                    currentEpisode = firstEp;
                } else {
                    currentEpisode = 1;
                    episodeSelect.value = 1;
                }
                loadPlayer();
            });

            episodeSelect.addEventListener('change', () => {
                const e = parseInt(episodeSelect.value) || 1;
                currentEpisode = e;
                loadPlayer();
            });

            document.getElementById('applyEpBtn').addEventListener('click', () => {
                const s = parseInt(seasonSelect.value) || 1;
                const e = parseInt(episodeSelect.value) || 1;
                currentSeason = s;
                currentEpisode = e;
                loadPlayer();
                showToast(`Season ${s}, Episode ${e} loaded`, 'info', 2000);
            });

            const header = document.getElementById('mainHeader');
            window.addEventListener('scroll', () => {
                header.classList.toggle('scrolled', window.scrollY > 10);
            });

            document.getElementById('profileBtn').addEventListener('click', () => {
                showToast('👤 Profile — Demo mode', 'info', 3000);
            });

            document.addEventListener('keydown', handleKeydown);

            const playerWrapper = document.getElementById('playerWrapper');
            playerWrapper.addEventListener('click', function(e) {
                const target = e.target;
                if (target === this || target.closest('.pause-ad-overlay') || target.closest('.pause-badge')) {
                    const iframe = document.getElementById('playerIframe');
                    if (iframe && iframe.style.display !== 'none') {
                        togglePauseAds();
                    }
                }
            });

            document.getElementById('pauseBadge').addEventListener('click', function(e) {
                e.stopPropagation();
                togglePauseAds();
            });

            window.addEventListener('message', function(event) {
                const iframe = document.getElementById('playerIframe');
                if (!iframe) return;

                let data = event.data;
                if (typeof data === 'string') {
                    try {
                        data = JSON.parse(data);
                    } catch (e) { /* not JSON */ }
                }

                if (data) {
                    if (data.event === 'onStateChange' && data.info === 2) { showPauseAds(); return; }
                    if (data.event === 'onStateChange' && data.info === 1) { hidePauseAds(); return; }
                    if (data.event === 'pause') { showPauseAds(); return; }
                    if (data.event === 'play') { hidePauseAds(); return; }
                    if (data.type === 'pause' || data.action === 'pause' || data.method === 'pause') { showPauseAds(); return; }
                    if (data.type === 'play' || data.action === 'play' || data.method === 'play' || data.type === 'playing') { hidePauseAds(); return; }
                    if (data.paused === true) { showPauseAds(); return; }
                    if (data.paused === false) { hidePauseAds(); return; }
                }
            });

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    hidePauseAds();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);

        window.addEventListener('error', (e) => {
            console.error('Uncaught error:', e.message);
            showToast('Something went wrong. Please refresh.', 'error', 4000);
        });

        // Block right-click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // Block DevTools shortcuts
        document.addEventListener('keydown', function(e) {
            const key = e.keyCode || e.which;
            if (key === 123) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && (key === 73 || key === 74 || key === 67)) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && (key === 85 || key === 83)) {
                e.preventDefault();
                return false;
            }
            if (e.metaKey && e.altKey && key === 73) {
                e.preventDefault();
                return false;
            }
            if (key === 44) {
                e.preventDefault();
                return false;
            }
            return true;
        });

        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
            return false;
        });
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });
    </script>
</body>
</html>
