<script>
document.addEventListener("DOMContentLoaded", function() {

    const replacements = [
        { pattern: /%0/g, replacement: '★' }, // Star fix for rating
        { pattern: /%C%C/g, replacement: '🎬' }, // Movie
        { pattern: /%D%D/g, replacement: '📝' }, // Plot
        { pattern: /%D%A/g, replacement: '📺' }, // TV/Watch
        { pattern: /%C%5/g, replacement: '✨' }, // Picked For You
        { pattern: /%D%5/g, replacement: '🔥' }, // Trending
        { pattern: /%4%F/g, replacement: '❤️' }, // Romantic
        { pattern: /%C%9/g, replacement: '🎧' }, // Party / Lo-Fi
        { pattern: /%D%4/g, replacement: '💔' }, // Heartbreak
        { pattern: /%D%B/g, replacement: '📻' }, // 90s Retro
        { pattern: /%1/g, replacement: '🌾' },   // Punjabi
        { pattern: /%C%8/g, replacement: '🎸' }, // Indie
        { pattern: /%4/g, replacement: '-' },    // Dash
        { pattern: /%6/g, replacement: '...' },  // Ellipsis
        { pattern: /%5/g, replacement: '✅' },   // Check
        { pattern: /%C/g, replacement: '🎵' },   // Fallback Music Note
        { pattern: /%D/g, replacement: '📝' }    // Fallback Memo
    ];

    // Text ko fix karne ka function
    function fixText() {
        // Target Alpine.js text bindings and general text nodes
        const walker = document.createTreeWalker(
            document.body,
            NodeFilter.SHOW_TEXT,
            null,
            false
        );

        let node;
        while (node = walker.nextNode()) {
            let text = node.nodeValue;
            if (text && text.includes('%')) {
                replacements.forEach(r => {
                    text = text.replace(r.pattern, r.replacement);
                });
                if (text !== node.nodeValue) {
                    node.nodeValue = text;
                }
            }
        }
    }

    // Page load hote hi fix karo
    fixText();

    // Kyunki Alpine.js dynamic content load karta hai, hume MutationObserver chahiye
    const observer = new MutationObserver(() => {
        fixText();
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
    });
});
</script>
