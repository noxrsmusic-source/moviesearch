<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Anime - RX Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --primary-red: #E50914;
            --primary-green: #22C55E;
            --bg-primary: #08080C;
            --bg-card: #14141F;
            --bg-secondary: #0F0F17;
            --text-white: #FFFFFF;
            --text-muted: #9CA3AF;
            --shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --header-height: 62px;
        }

        body {
            font-family: var(--font) !important;
            background: var(--bg-primary) !important;
            color: var(--text-white) !important;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding-top: var(--header-height);
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: var(--font); border: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }
        .container { max-width: 1440px; margin: 0 auto; padding: 0 20px; }

        /* HEADER */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(8, 8, 12, 0.95); backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 0; height: var(--header-height);
            display: flex; align-items: center;
        }
        .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
        .logo span { color: var(--primary-red); }
        .logo i { color: var(--primary-red); font-size: 18px; }
        .header-actions .back-btn {
            padding: 6px 16px; border-radius: 30px; background: rgba(255, 255, 255, 0.08);
            font-size: 13px; font-weight: 600; transition: var(--transition);
            display: flex; align-items: center; gap: 6px;
        }
        .header-actions .back-btn:hover { background: rgba(255, 255, 255, 0.15); }

        /* SEARCH BAR */
        .search-container {
            margin: 20px auto 10px;
            position: relative;
            display: flex;
            align-items: center;
            max-width: 800px;
        }
        .search-container input {
            width: 100%; height: 46px; padding: 0 44px 0 48px;
            border-radius: 50px; border: 1.5px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05); color: var(--text-white);
            font-size: 14.5px; outline: none; transition: var(--transition);
        }
        .search-container input:focus { 
            border-color: var(--primary-red); 
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(229, 9, 20, 0.15);
        }
        .search-container .search-icon {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 16px;
        }
        .search-container .clear-btn {
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 16px; cursor: pointer;
            display: none;
        }
        .search-container .clear-btn.visible { display: block; }

        /* FILTER SECTION */
        .filter-section {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
        }
        .filter-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px; align-items: end;
        }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label {
            font-size: 11px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .filter-group select {
            height: 40px; padding: 0 12px; border-radius: var(--radius-sm);
            background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff; font-size: 13px; outline: none; cursor: pointer;
            font-family: var(--font); transition: var(--transition);
        }
        .filter-group select:focus { border-color: var(--primary-red); }
        .filter-group select option { background: var(--bg-card); color: #fff; }
        
        .reset-btn {
            height: 40px; padding: 0 20px; border-radius: var(--radius-sm);
            background: rgba(229, 9, 20, 0.1); border: 1px solid rgba(229, 9, 20, 0.4);
            color: var(--primary-red); font-weight: 700; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: var(--transition);
        }
        .reset-btn:hover { background: var(--primary-red); color: #fff; }

        /* SECTIONS */
        .section-heading-wrap { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; margin-top: 28px; }
        .section-heading-wrap h3 { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .section-heading-wrap h3 i { color: var(--primary-red); }
        
        .horizontal-cards-row {
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px;
            scroll-snap-type: x mandatory; scrollbar-width: thin;
        }
        .horizontal-cards-row::-webkit-scrollbar { height: 6px; }
        .horizontal-cards-row::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .horizontal-cards-row .movie-card { flex: 0 0 125px; scroll-snap-align: start; }
        @media (min-width: 768px) {
            .horizontal-cards-row .movie-card { flex: 0 0 170px; }
            .horizontal-cards-row { gap: 16px; }
        }

        /* GRID FOR FILTERED RESULTS & SEARCH */
        .filtered-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; }
        @media (min-width: 768px) { .filtered-results { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; } }

        /* MOVIE CARD */
        .movie-card {
            border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-card);
            display: flex; flex-direction: column; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.04); transition: all var(--transition);
        }
        @media (min-width: 768px) { .movie-card { border-radius: var(--radius); } }
        .movie-card:hover { transform: translateY(-4px); border-color: rgba(229, 9, 20, 0.4); box-shadow: var(--shadow); }
        .movie-card .poster-wrap { position: relative; width: 100%; aspect-ratio: 2/3; overflow: hidden; background: #12121c; }
        .movie-card .poster { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .movie-card:hover .poster { transform: scale(1.04); }
        .movie-card .card-info { padding: 8px 10px; }
        @media (min-width: 768px) { .movie-card .card-info { padding: 12px 14px; } }
        .movie-card .card-info h4 { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (min-width: 768px) { .movie-card .card-info h4 { font-size: 14px; } }
        .movie-card .card-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-muted); margin-top: 4px; }
        @media (min-width: 768px) { .movie-card .card-meta { font-size: 11.5px; margin-top: 6px; } }

        /* LOADER */
        .loader-container { display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 60px 0; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary-red); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 16px; color: var(--text-muted); }
        .empty-state i { font-size: 48px; opacity: 0.3; margin-bottom: 14px; }

        /* =========================================================
           DETAIL MODAL (Exact copy from index.html)
           ========================================================= */
        .detail-modal-overlay {
            position: fixed; inset: 0; z-index: 2147483000;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center;
            padding: 16px; overflow-y: auto;
        }
        .detail-modal-overlay.open { display: flex; }

        .detail-modal-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 880px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 24px 80px rgba(0,0,0,0.9);
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
            animation: modalIn 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0)   scale(1); }
        }

        .detail-modal-close {
            position: absolute; top: 14px; right: 14px; z-index: 20;
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(0,0,0,0.75); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.18);
            backdrop-filter: blur(8px);
        }
        .detail-modal-close:hover { background: var(--primary-red); transform: rotate(90deg); }

        .detail-modal-loading {
            padding: 100px 20px; text-align: center;
            font-size: 32px; color: var(--primary-red);
            display: flex; flex-direction: column; align-items: center; gap: 16px;
        }
        .detail-modal-loading span { font-size: 14px; color: var(--text-muted); }

        .detail-backdrop {
            position: relative; width: 100%;
            aspect-ratio: 16 / 9; min-height: 220px;
            background-size: cover; background-position: center top;
            background-color: #0a0a0f;
        }
        .detail-backdrop-gradient {
            position: absolute; inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(20,20,31,0.20) 0%,
                rgba(20,20,31,0.70) 60%,
                var(--bg-card) 100%
            );
        }
        .detail-header-content {
            position: relative;
            padding: 24px 24px 16px;
            margin-top: -60px;
            z-index: 2;
        }
        @media (min-width: 768px) {
            .detail-header-content { margin-top: -80px; padding: 28px 28px 20px; }
        }
        .detail-header-content h2 {
            font-size: clamp(20px, 4vw, 30px); font-weight: 900; margin-bottom: 8px;
            letter-spacing: -0.5px; line-height: 1.15;
            text-shadow: 0 2px 14px rgba(0,0,0,0.85);
            color: #fff;
        }
        .detail-meta {
            display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
            font-size: 13px; color: #e5e5e5; margin-bottom: 10px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.7);
        }
        .detail-badge {
            font-size: 10px; font-weight: 800; letter-spacing: 0.5px;
            padding: 3px 10px; border-radius: 4px;
            background: rgba(229,9,20,0.9); color: #fff;
            text-transform: uppercase;
        }
        .detail-rating {
            color: #F5C518; font-weight: 700;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .detail-genres { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .detail-genre-chip {
            font-size: 11px; font-weight: 600;
            padding: 4px 10px; border-radius: 20px;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.15);
            color: #e5e5e5;
            backdrop-filter: blur(6px);
        }
        .detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        .detail-watch-btn, .detail-watchlist-btn, .detail-download-btn, .detail-trailer-btn {
            padding: 10px 24px; border-radius: 30px;
            font-weight: 800; font-size: 13.5px;
            display: inline-flex; align-items: center; gap: 8px;
            transition: var(--transition); border: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .detail-watch-btn { background: #fff; color: #000; }
        .detail-watch-btn:hover { background: #e5e5e5; transform: scale(1.04); }
        
        .detail-watchlist-btn { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .detail-watchlist-btn:hover { background: rgba(255,255,255,0.22); transform: scale(1.04); }
        .detail-watchlist-btn.active { background: rgba(34,197,94,0.18); border-color: rgba(34,197,94,0.6); color: #4ade80; }

        .detail-download-btn {
            background: linear-gradient(135deg, #22C55E 0%, #16a34a 100%);
            color: #fff;
            border: 1px solid rgba(34,197,94,0.4);
            box-shadow: 0 6px 20px rgba(34,197,94,0.35);
        }
        .detail-download-btn:hover {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            transform: scale(1.04);
            box-shadow: 0 10px 26px rgba(34,197,94,0.5);
        }
        .detail-download-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .detail-trailer-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            color: #fff;
            border: 1px solid rgba(56,189,248,0.4);
            box-shadow: 0 6px 20px rgba(56,189,248,0.35);
        }
        .detail-trailer-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            transform: scale(1.04);
            box-shadow: 0 10px 26px rgba(56,189,248,0.5);
        }
        .detail-trailer-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .detail-trailer-wrap {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 5;
        }
        .detail-trailer-wrap iframe {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            border: 0;
        }
        .detail-trailer-close {
            position: absolute; top: 12px; right: 12px;
            z-index: 10;
            padding: 8px 16px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            border-radius: 30px;
            font-size: 12px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            transition: var(--transition);
            cursor: pointer;
        }
        .detail-trailer-close:hover {
            background: var(--primary-red);
            border-color: var(--primary-red);
        }

        .detail-selector-row {
            display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .detail-selector-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
        .detail-selector-group label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .detail-selector-group select {
            background: var(--bg-secondary); color: #fff; border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; font-family: var(--font);
        }
        .detail-selector-group select:focus { border-color: var(--primary-red); }

        .detail-body { padding: 0 24px 28px; }
        @media (min-width: 768px) { .detail-body { padding: 0 28px 28px; } }

        .detail-info-grid {
            display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px;
            margin-bottom: 20px;
        }
        @media (max-width: 640px) {
            .detail-info-grid { grid-template-columns: 1fr; gap: 16px; }
        }

        .detail-overview {
            font-size: 14px; line-height: 1.6;
            color: rgba(255,255,255,0.88);
        }

        .detail-facts { display: flex; flex-direction: column; gap: 10px; }
        .detail-fact {
            font-size: 13px; display: flex; flex-direction: column; gap: 2px;
        }
        .detail-fact .fact-label {
            font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px;
            color: var(--text-muted); text-transform: uppercase;
        }
        .detail-fact .fact-value { color: #fff; font-weight: 600; }

        .detail-cast h4 {
            font-size: 13px; font-weight: 800; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--text-muted);
        }
        .detail-cast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
        }
        .detail-cast-item {
            background: var(--bg-secondary);
            border-radius: 8px; padding: 10px;
            text-align: center; border: 1px solid rgba(255,255,255,0.04);
            transition: var(--transition);
        }
        .detail-cast-item:hover { border-color: rgba(229,9,20,0.4); transform: translateY(-2px); }
        .detail-cast-avatar {
            width: 52px; height: 52px; border-radius: 50%;
            margin: 0 auto 8px;
            background: rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; color: var(--text-muted); font-size: 18px;
            border: 2px solid rgba(255,255,255,0.08);
        }
        .detail-cast-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .detail-cast-item span {
            display: block; font-size: 11px; font-weight: 600;
            line-height: 1.3; color: #fff;
            overflow: hidden; text-overflow: ellipsis;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .detail-cast-item small {
            display: block; font-size: 9.5px; color: var(--text-muted);
            margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        @media (max-width: 640px) {
            .detail-modal-overlay { padding: 10px; align-items: center; }
            .detail-modal-box { border-radius: var(--radius); max-height: 92vh; }
            .detail-backdrop { min-height: 180px; aspect-ratio: 16/9; }
            .detail-actions { width: 100%; flex-direction: column; }
            .detail-watch-btn, .detail-watchlist-btn, .detail-download-btn, .detail-trailer-btn { width: 100%; justify-content: center; }
        }

        .modal-alert-wrapper {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 2147483002; width: 100%; max-width: 420px;
            pointer-events: none; display: flex; justify-content: center;
        }
        .modal-alert-box {
            background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm); padding: 14px 22px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            display: flex; align-items: center; gap: 14px;
            pointer-events: auto; width: 100%;
            animation: alertIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 4px solid var(--primary-red);
        }
        .modal-alert-box.success { border-left-color: var(--primary-green); }
        .modal-alert-box.info { border-left-color: #38bdf8; }
        .modal-alert-box.error { border-left-color: var(--primary-red); }
        .modal-alert-box i { font-size: 20px; color: var(--primary-red); }
        .modal-alert-box.success i { color: var(--primary-green); }
        .modal-alert-box.info i { color: #38bdf8; }
        .modal-alert-box span { font-size: 14px; font-weight: 600; color: #fff; line-height: 1.4; }
        @keyframes alertIn {
            from { opacity: 0; transform: translateY(-24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .toast-container {
            position: fixed; bottom: 130px; right: 24px; z-index: 999999;
            display: flex; flex-direction: column; gap: 10px;
            max-width: 380px; width: 100%; pointer-events: none;
        }
        .toast {
            padding: 12px 18px; border-radius: var(--radius-sm);
            background: var(--bg-card); border-left: 4px solid var(--primary-red);
            box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 10px; font-size: 13.5px;
            pointer-events: auto;
        }
        .toast.success { border-left-color: var(--primary-green); }
        .toast.error { border-left-color: var(--primary-red); }
        .toast.info { border-left-color: #38bdf8; }
    </style>
</head>
<body x-data="animeApp()" x-init="init()">

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <i class="fas fa-play-circle"></i> RX<span>PLAYER</span>
            </a>
            <div class="header-actions">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            </div>
        </div>
    </header>

    <main class="container">
        
        <!-- SEARCH BAR -->
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input 
                type="text" 
                x-model="searchQuery" 
                @input="onSearchInput($event.target.value)" 
                placeholder="Search for an anime by name..." 
                autocomplete="off"
            >
            <i class="fas fa-times clear-btn" :class="{ 'visible': searchQuery.length > 0 }" @click="clearSearch()"></i>
        </div>

        <!-- FILTER BAR (Non-Sticky) -->
        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label><i class="fas fa-masks-theater"></i> Genre</label>
                    <select x-model="filters.genre" @change="applyFilters()">
                        <option value="">All Genres</option>
                        <option value="10759">Action & Adventure</option>
                        <option value="35">Comedy</option>
                        <option value="18">Drama</option>
                        <option value="10765">Fantasy & Magic</option>
                        <option value="878">Sci-Fi & Mecha</option>

                            <div class="detail-cast-grid">

                                        <div class="detail-cast-avatar">

                                                <img :src="'https://image.tmdb.org/t/p/w185' + c.profile_path" :alt="c.name" loading="lazy" />
                                            </template>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const API = "https://rxplayer-indol.vercel.app/api";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCa-Ut8CCiZac7MPpeuw0LSjLehqLO4ICw",
            authDomain: "rxplayer-a2582.firebaseapp.com",
            databaseURL: "https://rxplayer-a2582-default-rtdb.firebaseio.com",
            projectId: "rxplayer-a2582",
            storageBucket: "rxplayer-a2582.firebasestorage.app",
            messagingSenderId: "208971977557",
            appId: "1:208971977557:web:501ee9138aa40dbef595dc",
            measurementId: "G-28GFZHBB6P"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function animeApp() {
            return {
                loading: true,
                sections: [],
                filteredSeries: [],
                
                // Search State
                searchQuery: '',
                searchResults: [],
                _searchDebounce: null,

                filters: {
                    genre: '',
                    year: ''
                },
                
                // Details Modal
                detailModalOpen: false,
                detailLoading: false,
                detailData: null,
                detailItem: { id: null, type: 'tv' },
                trailerActive: false,
                selectedSeason: 1,
                selectedEpisode: 1,
                currentSeasonEpisodesCount: 1,
                modalAlert: { show: false, message: '', type: 'info', timer: null },

                // Auth & Watchlist State
                currentUser: null,
                watchlist: [],

                get hasActiveFilters() {
                    return Object.values(this.filters).some(v => v !== '');
                },

                get detailSeasonsList() {
                    if (!this.detailData || !this.detailData.seasons) return [];
                    return this.detailData.seasons.filter(s => s.season_number > 0);
                },

                async init() {
                    // Firebase Auth Listener
                    auth.onAuthStateChanged(async (user) => {
                        this.currentUser = user;
                        if (user) {
                            await this.loadWatchlist();
                        } else {
                            this.watchlist = [];
                        }
                    });

                    await this.loadAllSections();
                },

                async loadWatchlist() {
                    if (!this.currentUser) {
                        this.watchlist = [];
                        return;
                    }
                    try {
                        const snap = await db.collection('users')
                            .doc(this.currentUser.uid)
                            .collection('watchlist')
                            .get();
                        this.watchlist = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
                    } catch (e) {
                        console.warn('watchlist load failed:', e.message);
                        this.watchlist = [];
                    }
                },

                async request(url) {
                    try {
                        const res = await fetch(API + url);
                        const data = await res.json();
                        if (!res.ok || data.success === false) throw new Error(data.error || "Request failed");
                        return data;
                    } catch (e) { return { results: [] }; }
                },

                async fetchTmdb(endpoint) {
                    return this.request("/tmdb-proxy?endpoint=" + encodeURIComponent(endpoint));
                },

                // SEARCH LOGIC
                onSearchInput(val) {
                    if (this._searchDebounce) clearTimeout(this._searchDebounce);
                    this._searchDebounce = setTimeout(async () => {
                        if (val.trim().length >= 2) {
                            await this.performSearch(val.trim());
                        } else if (val.trim().length === 0) {
                            this.searchResults = [];
                        }
                    }, 500);
                },

                async performSearch(query) {
                    this.loading = true;
                    const res = await this.fetchTmdb(`/search/multi?query=${encodeURIComponent(query)}&language=en-US&page=1`);
                    // Filter out non-anime
                    this.searchResults = (res.results || []).filter(i => 
                        i.poster_path && 
                        (i.media_type === 'movie' || i.media_type === 'tv') &&
                        i.original_language === 'ja' && 
                        i.genre_ids && i.genre_ids.includes(16) // Animation genre
                    );
                    this.loading = false;
                },

                clearSearch() {
                    this.searchQuery = '';
                    this.searchResults = [];
                },

                // FILTER LOGIC
                async applyFilters() {
                    if (!this.hasActiveFilters) {
                        this.filteredSeries = [];
                        return;
                    }

                    this.loading = true;

                    // Base filters for TV Anime
                    let params = ['sort_by=popularity.desc', 'with_genres=16', 'with_original_language=ja'];
                    if (this.filters.genre) params.push(`with_genres=16,${this.filters.genre}`);
                    
                    if (this.filters.year === 'older') {
                        params.push(`first_air_date.lte=2010`);
                    } else if (this.filters.year) {
                        params.push(`first_air_date_year=${this.filters.year}`);
                    }

                    const endpoint = `/discover/tv?${params.join('&')}`;
                    const res = await this.fetchTmdb(endpoint);
                    
                    this.filteredSeries = (res.results || []).filter(i => i.poster_path);
                    this.loading = false;
                },

                resetFilters() {
                    this.filters = { genre: '', year: '' };
                    this.filteredSeries = [];
                },

                // DEFAULT SECTIONS (Anime Specific)
                async loadAllSections() {
                    this.loading = true;
                    
                    const today = new Date().toISOString().split('T')[0];
                    const sixMonthsAgo = new Date(Date.now() - 180 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                    
                    const base = 'with_genres=16&with_original_language=ja';

                    const endpoints = [
                        { id: 'trending', title: 'Trending Anime', icon: 'fas fa-fire', url: `/discover/tv?sort_by=popularity.desc&${base}` },
                        { id: 'picked', title: 'Picked For You', icon: 'fas fa-wand-magic-sparkles', url: `/discover/tv?sort_by=vote_average.desc&vote_count.gte=100&${base}` },
                        { id: 'recent', title: 'Recently Added', icon: 'fas fa-clock', url: `/discover/tv?sort_by=first_air_date.desc&first_air_date.gte=${sixMonthsAgo}&first_air_date.lte=${today}&${base}` },
                        { id: 'action', title: 'Action & Adventure', icon: 'fas fa-bolt', url: `/discover/tv?with_genres=16,10759&${base}` },
                        { id: 'fantasy', title: 'Fantasy & Magic', icon: 'fas fa-wand-sparkles', url: `/discover/tv?with_genres=16,10765&${base}` },
                        { id: 'scifi', title: 'Sci-Fi & Mecha', icon: 'fas fa-robot', url: `/discover/tv?with_genres=16,878&${base}` },
                        { id: 'romance', title: 'Romance & Slice of Life', icon: 'fas fa-heart', url: `/discover/tv?with_genres=16,10749&${base}` },
                        { id: 'comedy', title: 'Comedy & Parody', icon: 'fas fa-face-laugh-squint', url: `/discover/tv?with_genres=16,35&${base}` },
                        { id: 'mystery', title: 'Mystery & Thriller', icon: 'fas fa-user-secret', url: `/discover/tv?with_genres=16,9648&${base}` },
                        { id: 'movies', title: 'Anime Movies', icon: 'fas fa-film', type: 'movie', url: `/discover/movie?with_genres=16&with_original_language=ja&sort_by=popularity.desc` },
                        { id: 'toprated', title: 'Top Rated Anime', icon: 'fas fa-star', url: `/discover/tv?sort_by=vote_average.desc&vote_count.gte=500&${base}` },
                        { id: 'hidden', title: 'Hidden Gems', icon: 'fas fa-gem', url: `/discover/tv?sort_by=vote_average.desc&vote_count.gte=50&vote_average.gte=8&${base}` }
                    ];

                    const promises = endpoints.map(async (ep) => {
                        const res = await this.fetchTmdb(ep.url);
                        let items = (res.results || []).filter(i => i.poster_path).map(i => ({ ...i, media_type: ep.type || 'tv' }));
                        if (items.length === 0) return null;
                        return { ...ep, items: items.slice(0, 20) };
                    });

                    const results = await Promise.all(promises);
                    this.sections = results.filter(r => r !== null);
                    this.loading = false;
                },

                // UTILS
                poster(item) {
                    if (!item) return 'https://placehold.co/300x450/14141F/666?text=No+Image';
                    if (!item.poster_path) return 'https://placehold.co/300x450/14141F/666?text=No+Image';
                    const p = String(item.poster_path);
                    if (p.startsWith('http')) return p;
                    return 'https://image.tmdb.org/t/p/w500' + (p.startsWith('/') ? p : '/' + p);
                },
                title(item) { return item ? (item.title || item.name || 'Untitled') : ''; },
                year(item) { const d = item.first_air_date || item.release_date; return d ? d.substring(0, 4) : 'N/A'; },
                rating(item) { return (item && typeof item.vote_average === 'number') ? item.vote_average.toFixed(1) : 'N/A'; },

                // DETAILS MODAL
                async openDetails(id, type = 'tv') {
                    this.detailItem = { id, type };
                    this.detailData = null;
                    this.trailerActive = false;
                    this.detailLoading = true;
                    this.detailModalOpen = true;
                    this.selectedSeason = 1;
                    this.selectedEpisode = 1;
                    this.modalAlert.show = false;
                    document.body.style.overflow = 'hidden';

                    try {
                        const endpoint = `/${type}/${id}?language=en-US&append_to_response=credits,videos`;
                        const data = await this.request("/tmdb-proxy?endpoint=" + encodeURIComponent(endpoint));
                        this.detailData = data;
                        
                        if (type === 'tv' && data.seasons && data.seasons.length > 0) {
                            const validSeasons = data.seasons.filter(s => s.season_number > 0);
                            this.selectedSeason = validSeasons.length > 0 ? validSeasons[0].season_number : 1;
                            this.onSeasonChange();
                        }
                    } catch (e) {
                        this.closeDetailModal();
                    } finally {
                        this.detailLoading = false;
                    }
                },
                onSeasonChange() {
                    if (!this.detailData || !this.detailData.seasons) return;
                    const seasonObj = this.detailData.seasons.find(s => s.season_number == this.selectedSeason);
                    this.currentSeasonEpisodesCount = seasonObj ? (seasonObj.episode_count || 1) : 1;
                    this.selectedEpisode = 1;
                },
                closeDetailModal() {
                    this.detailModalOpen = false;
                    this.modalAlert.show = false;
                    this.trailerActive = false;
                    document.body.style.overflow = '';
                    setTimeout(() => {
                        if (!this.detailModalOpen) {
                            this.detailData = null;
                            this.detailItem = { id: null, type: 'tv' };
                        }
                    }, 300);
                },
                goToPlayer() {
                    if (!this.detailItem || !this.detailItem.id) return;
                    const { id, type } = this.detailItem;
                    const title = encodeURIComponent(this.detailTitle(this.detailData) || 'Anime');
                    const poster = encodeURIComponent(this.poster(this.detailData));

                    // Direct to player.html
                    let url = `player.html?id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}&title=${title}&poster=${poster}`;
                    if (type === 'tv') {
                        url += `&season=${this.selectedSeason}&episode=${this.selectedEpisode}`;
                    } else {
                        url += `&season=1&episode=1`;
                    }
                    window.location.href = url;
                },
                downloadContent() {
                    if (!this.detailItem || !this.detailItem.id) {
                        this.showToast('Download link available nahi hai.', 'error');
                        return;
                    }
                    const { id, type } = this.detailItem;
                    const title = encodeURIComponent(this.detailTitle(this.detailData) || 'Anime');
                    const poster = encodeURIComponent(this.poster(this.detailData));

                    // Direct to download.html
                    let url = `download.html?id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}&title=${title}&poster=${poster}`;

                    if (type === 'tv') {
                        url += `&season=${this.selectedSeason || 1}&episode=${this.selectedEpisode || 1}`;
                    } else {
                        url += `&season=1&episode=1`;
                    }

                    const label = type === 'tv'
                        ? `S${this.selectedSeason} E${this.selectedEpisode}`
                        : (this.detailTitle(this.detailData) || 'Anime');

                    this.showToast(`Opening download page for ${label}…`, 'success');
                    window.location.href = url;
                },
                get detailTrailerKey() {
                    if (!this.detailData || !this.detailData.videos) return null;
                    const vids = this.detailData.videos.results || [];
                    const v = vids.find(v => v.site === 'YouTube' && v.type === 'Trailer') || vids.find(v => v.site === 'YouTube');
                    return v ? v.key : null;
                },
                watchTrailer() { if (this.detailTrailerKey) this.trailerActive = true; },
                closeTrailer() { this.trailerActive = false; },
                detailTitle(d) { return d ? (d.title || d.name) : ''; },
                detailYear(d) { const dt = d.first_air_date || d.release_date; return dt ? dt.slice(0,4) : ''; },
                detailRatingVal(d) { return d.vote_average ? d.vote_average.toFixed(1) : '—'; },
                detailRuntimeVal(d) { 
                    if (!d) return '—';
                    if (this.detailItem.type === 'movie') return d.runtime ? d.runtime + ' min' : '—';
                    const n = d.number_of_seasons || (Array.isArray(d.seasons) ? d.seasons.length : 0);
                    return n ? `${n} Season${n > 1 ? 's' : ''}` : '—';
                },
                detailBackdrop(d) { return d.backdrop_path ? `https://image.tmdb.org/t/p/original${d.backdrop_path}` : this.poster(d); },
                detailOriginalLanguage(d) {
                    if (!d || !d.original_language) return '';
                    return String(d.original_language).toUpperCase();
                },
                detailStatus(d) {
                    if (!d || !d.status) return '';
                    return d.status;
                },
                get detailCastList() {
                    if (!this.detailData || !this.detailData.credits) return [];
                    return (this.detailData.credits.cast || []).slice(0, 12);
                },

                // Watchlist Logic (Firestore + Auth Guard)
                get isInWatchlist() {
                    if (!this.detailItem || !this.detailItem.id) return false;
                    return this.watchlist.some(w => String(w.id) === String(this.detailItem.id) && (w.type || 'movie') === this.detailItem.type);
                },
                _watchlistKey(item) {
                    return `${item.type || 'movie'}_${item.id}`;
                },
                async toggleWatchlist() {
                    if (!this.detailItem || !this.detailItem.id || !this.detailData) return;

                    // STRICT LOGIN CHECK
                    if (!this.currentUser) {
                        this.showToast('Please login to use Watch Later feature.', 'error');
                        return;
                    }

                    const exists = this.watchlist.some(w => String(w.id) === String(this.detailItem.id) && (w.type || 'movie') === this.detailItem.type);
                    const docId = this._watchlistKey(this.detailItem);
                    const d = this.detailData;

                    const entry = {
                        id: this.detailItem.id,
                        type: this.detailItem.type,
                        media_type: this.detailItem.type,
                        title: this.detailTitle(d),
                        poster_path: d.poster_path || '',
                        poster_url: this.poster(d),
                        vote_average: d.vote_average || 0,
                        release_date: d.release_date || d.first_air_date || '',
                        genres: (d.genres || []).map(g => g.id),
                        original_language: d.original_language || '',
                        overview: d.overview || '',
                        docId: docId,
                        addedAt: Date.now()
                    };

                    try {
                        if (exists) {
                            await db.collection('users').doc(this.currentUser.uid).collection('watchlist').doc(docId).delete();
                            this.watchlist = this.watchlist.filter(w => w.docId !== docId);
                            this.showModalAlert('Removed from Watch Later', 'info');
                        } else {
                            await db.collection('users').doc(this.currentUser.uid).collection('watchlist').doc(docId).set(entry, { merge: true });
                            this.watchlist.push(entry);
                            this.showModalAlert('Added to Watch Later', 'success');
                        }
                    } catch (e) {
                        console.error(e);
                        this.showToast('Could not update Watch Later. Please try again.', 'error');
                    }
                },

                showToast(message, type = 'info', duration = 3500) {
                    const icons = { info: 'fa-info-circle', success: 'fa-check-circle', error: 'fa-exclamation-circle' };
                    const container = document.getElementById('toastContainer');
                    if (!container) return;
                    const toast = document.createElement('div');
                    toast.className = `toast ${type}`;
                    toast.innerHTML = `<span><i class="fas ${icons[type] || icons.info}"></i></span><span>${message}</span>`;
                    container.appendChild(toast);
                    setTimeout(() => { toast.remove(); }, duration);
                },
                showModalAlert(message, type = 'info', duration = 3000) {
                    if (this.modalAlert.timer) clearTimeout(this.modalAlert.timer);
                    this.modalAlert.message = message;
                    this.modalAlert.type = type;
                    this.modalAlert.show = true;
                    this.modalAlert.timer = setTimeout(() => {
                        this.modalAlert.show = false;
                    }, duration);
                }
            }
        }
    </script>
</body>
</html>
